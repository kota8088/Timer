<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON TIMER - 多機能タイマー</title>
<style>
/* ===== 全体デザイン（暗めのネオン） ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000000 100%);
  min-height: 100vh;
  color: #e0e0e0;
  overflow-x: hidden;
  position: relative;
}

/* 星の背景（薄く） */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: 
    radial-gradient(1px 1px at 20px 30px, #ccc, transparent),
    radial-gradient(1px 1px at 40px 70px, #ddd, transparent),
    radial-gradient(1px 1px at 90px 40px, #eee, transparent);
  background-size: 250px 250px;
  opacity: 0.15;
  animation: twinkle 10s infinite alternate;
  pointer-events: none;
}

@keyframes twinkle {
  from { opacity: 0.1; }
  to { opacity: 0.25; }
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
  z-index: 1;
}

h1 {
  text-align: center;
  font-size: 2.2rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #4fc3f7;
  text-shadow: 0 0 8px #4fc3f7, 0 0 15px #4fc3f7;
  margin-bottom: 25px;
}

h2 {
  color: #f06292;
  text-shadow: 0 0 5px #f06292, 0 0 10px #f06292;
  font-size: 1.3rem;
  margin-bottom: 15px;
  border-bottom: 1px solid rgba(240, 98, 146, 0.2);
  padding-bottom: 5px;
  font-weight: 300;
}

/* 各セクションの共通カード */
.card {
  background: rgba(10, 20, 30, 0.8);
  border: 1px solid #4fc3f7;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 25px;
  box-shadow: 0 0 10px rgba(79, 195, 247, 0.15), inset 0 0 5px rgba(79, 195, 247, 0.05);
  backdrop-filter: blur(3px);
}

/* ===== 通知ON/OFFトグル ===== */
.notification-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-bottom: 20px;
}

.notification-toggle label {
  font-size: 0.95rem;
  color: #b0bec5;
}

.switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 24px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #37474f;
  transition: 0.4s;
  border-radius: 24px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: #90a4ae;
  transition: 0.4s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: #4fc3f7;
}

input:checked + .slider:before {
  transform: translateX(26px);
  background-color: #fff;
}

/* ===== 世界時計 ===== */
.world-clock {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.clock-search {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.clock-search input[type="text"] {
  flex: 1;
  padding: 8px 15px;
  border: 1px solid #4fc3f7;
  border-radius: 30px;
  background: rgba(79, 195, 247, 0.05);
  color: #fff;
  font-size: 0.95rem;
  outline: none;
  transition: all 0.3s;
}

.clock-search input[type="text"]:focus {
  box-shadow: 0 0 8px rgba(79, 195, 247, 0.5);
}

.clock-search select {
  padding: 8px;
  border: 1px solid #4fc3f7;
  border-radius: 20px;
  background: #0d1b2a;
  color: #fff;
  font-size: 0.9rem;
  cursor: pointer;
}

.clock-display {
  text-align: center;
  font-size: 2.5rem;
  font-weight: bold;
  color: #a5d6a7;
  text-shadow: 0 0 6px #a5d6a7, 0 0 12px #a5d6a7;
  letter-spacing: 3px;
}

.clock-city {
  text-align: center;
  color: #4fc3f7;
  font-size: 1.1rem;
  margin-top: 5px;
}

/* ===== ストップウォッチ ===== */
.stopwatch-display {
  font-size: 2.5rem;
  text-align: center;
  color: #f06292;
  text-shadow: 0 0 6px #f06292, 0 0 12px #f06292;
  margin: 15px 0;
  letter-spacing: 3px;
}

.btn-group {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 25px;
  border: 1px solid #4fc3f7;
  border-radius: 50px;
  background: transparent;
  color: #4fc3f7;
  font-size: 0.95rem;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  text-shadow: 0 0 3px #4fc3f7;
  box-shadow: 0 0 8px rgba(79, 195, 247, 0.1);
}

.btn:hover {
  background: #4fc3f7;
  color: #000;
  box-shadow: 0 0 20px #4fc3f7;
}

.btn-green {
  border-color: #a5d6a7;
  color: #a5d6a7;
  box-shadow: 0 0 8px rgba(165, 214, 167, 0.1);
  text-shadow: 0 0 3px #a5d6a7;
}

.btn-green:hover {
  background: #a5d6a7;
  color: #000;
  box-shadow: 0 0 20px #a5d6a7;
}

.btn-pink {
  border-color: #f06292;
  color: #f06292;
  box-shadow: 0 0 8px rgba(240, 98, 146, 0.1);
  text-shadow: 0 0 3px #f06292;
}

.btn-pink:hover {
  background: #f06292;
  color: #000;
  box-shadow: 0 0 20px #f06292;
}

/* ===== アラーム ===== */
.alarm-setup {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 15px;
}

.alarm-time-input {
  display: flex;
  align-items: center;
  gap: 5px;
}

.alarm-time-input input[type="number"] {
  width: 65px;
  padding: 6px;
  border: 1px solid #f06292;
  border-radius: 8px;
  background: rgba(240, 98, 146, 0.05);
  color: #fff;
  font-size: 1.1rem;
  text-align: center;
  outline: none;
}

.alarm-time-input input[type="number"]:focus {
  box-shadow: 0 0 8px #f06292;
}

.alarm-days {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.day-check {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px 8px;
  border: 1px solid #4fc3f7;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s;
  font-size: 0.85rem;
}

.day-check:hover {
  background: rgba(79, 195, 247, 0.1);
}

.day-check input[type="checkbox"] {
  accent-color: #4fc3f7;
}

.alarm-status {
  margin-top: 8px;
  color: #a5d6a7;
  font-size: 1rem;
  text-align: center;
}

/* ===== タイマー（汎用） ===== */
.timer-setup {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  margin: 15px 0;
}

.timer-input-group {
  display: flex;
  align-items: center;
  gap: 3px;
}

.timer-input-group input[type="number"] {
  width: 60px;
  padding: 6px;
  border: 1px solid #4fc3f7;
  border-radius: 8px;
  background: rgba(79, 195, 247, 0.05);
  color: #fff;
  font-size: 1.1rem;
  text-align: center;
}

.timer-display {
  font-size: 2.5rem;
  text-align: center;
  color: #ce93d8;
  text-shadow: 0 0 6px #ce93d8, 0 0 12px #ce93d8;
  margin: 15px 0;
  letter-spacing: 3px;
}

/* ===== ポモドーロ ===== */
.pomodoro-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 15px;
  margin-bottom: 15px;
}

.pomodoro-card {
  background: rgba(10, 15, 25, 0.9);
  border: 1px solid #a5d6a7;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 0 10px rgba(165, 214, 167, 0.1);
  position: relative;
}

.pomodoro-card h3 {
  color: #a5d6a7;
  text-shadow: 0 0 5px #a5d6a7;
  margin-bottom: 8px;
  font-size: 1.1rem;
  text-align: center;
}

.pomodoro-settings {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
  align-items: center;
  justify-content: center;
}

.pomodoro-settings label {
  color: #90a4ae;
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 3px;
}

.pomodoro-settings input[type="number"] {
  width: 50px;
  padding: 4px;
  border: 1px solid #a5d6a7;
  border-radius: 5px;
  background: rgba(165, 214, 167, 0.05);
  color: #fff;
  text-align: center;
  font-size: 0.9rem;
}

.pomodoro-settings select {
  padding: 4px;
  border: 1px solid #a5d6a7;
  border-radius: 5px;
  background: #0d1b2a;
  color: #fff;
  font-size: 0.85rem;
}

.pomodoro-display {
  font-size: 2rem;
  text-align: center;
  color: #fff;
  text-shadow: 0 0 8px #a5d6a7;
  margin: 10px 0;
  font-weight: bold;
}

.pomodoro-controls {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.pomodoro-controls .btn {
  padding: 5px 12px;
  font-size: 0.8rem;
}

.pomodoro-status {
  text-align: center;
  margin-top: 8px;
  color: #f06292;
  font-size: 0.85rem;
}

.add-pomodoro-btn {
  display: block;
  margin: 15px auto;
  padding: 10px 25px;
  font-size: 1rem;
  border: 1px dashed #f06292;
  background: transparent;
  color: #f06292;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s;
  text-shadow: 0 0 3px #f06292;
}

.add-pomodoro-btn:hover {
  background: rgba(240, 98, 146, 0.1);
  box-shadow: 0 0 15px rgba(240, 98, 146, 0.2);
}

/* レスポンシブ */
@media (max-width: 600px) {
  h1 { font-size: 1.5rem; }
  .clock-display { font-size: 1.8rem; }
  .stopwatch-display, .timer-display { font-size: 1.8rem; }
  .pomodoro-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <h1>⚡ NEON TIMER ⚡</h1>

  <!-- 通知トグル -->
  <div class="notification-toggle">
    <label>デスクトップ通知</label>
    <label class="switch">
      <input type="checkbox" id="notifToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <!-- ===== 世界時計 ===== -->
  <div class="card">
    <h2>🌍 世界時計</h2>
    <div class="world-clock">
      <div class="clock-search">
        <input type="text" id="citySearch" placeholder="都市名で検索...">
        <select id="citySelect" size="1"></select>
      </div>
      <div class="clock-display" id="worldClockTime">00:00:00</div>
      <div class="clock-city" id="worldClockCity">東京</div>
    </div>
  </div>

  <!-- ===== タイマー（汎用） ===== -->
  <div class="card">
    <h2>⏲️ タイマー</h2>
    <div class="timer-display" id="timerDisplay">00:00:00</div>
    <div class="timer-setup">
      <div class="timer-input-group">
        <input type="number" id="timerHour" min="0" max="23" value="0" placeholder="時">
        <span>:</span>
        <input type="number" id="timerMin" min="0" max="59" value="0" placeholder="分">
        <span>:</span>
        <input type="number" id="timerSec" min="0" max="59" value="0" placeholder="秒">
      </div>
      <button class="btn" id="timerSetBtn">設定</button>
      <button class="btn btn-green" id="timerStartBtn">スタート</button>
      <button class="btn btn-pink" id="timerStopBtn">ストップ</button>
      <button class="btn" id="timerResetBtn">リセット</button>
    </div>
  </div>

  <!-- ===== ストップウォッチ ===== -->
  <div class="card">
    <h2>⏱️ ストップウォッチ</h2>
    <div class="stopwatch-display" id="stopwatchDisplay">00:00.00</div>
    <div class="btn-group">
      <button class="btn btn-green" id="swStart">スタート</button>
      <button class="btn btn-pink" id="swStop">ストップ</button>
      <button class="btn" id="swReset">リセット</button>
    </div>
  </div>

  <!-- ===== アラーム ===== -->
  <div class="card">
    <h2>⏰ アラーム</h2>
    <div class="alarm-setup">
      <div class="alarm-time-input">
        <input type="number" id="alarmHour" min="0" max="23" value="7" placeholder="時">
        <span>:</span>
        <input type="number" id="alarmMin" min="0" max="59" value="0" placeholder="分">
      </div>
      <div class="alarm-days" id="alarmDays">
        <label class="day-check"><input type="checkbox" value="0">日</label>
        <label class="day-check"><input type="checkbox" value="1">月</label>
        <label class="day-check"><input type="checkbox" value="2">火</label>
        <label class="day-check"><input type="checkbox" value="3">水</label>
        <label class="day-check"><input type="checkbox" value="4">木</label>
        <label class="day-check"><input type="checkbox" value="5">金</label>
        <label class="day-check"><input type="checkbox" value="6">土</label>
      </div>
      <button class="btn btn-pink" id="alarmSetBtn">アラーム設定</button>
    </div>
    <div class="alarm-status" id="alarmStatus">アラーム未設定</div>
  </div>

  <!-- ===== ポモドーロタイマー ===== -->
  <div class="card">
    <h2>🍅 ポモドーロタイマー</h2>
    <div class="pomodoro-grid" id="pomodoroGrid"></div>
    <button class="add-pomodoro-btn" id="addPomodoroBtn">+ ポモドーロタイマーを追加</button>
  </div>
</div>

<script>
// ============================================================
// グローバル設定
// ============================================================
const MAX_LIMIT_SECONDS = 23 * 3600 + 59 * 60 + 59; // 23:59:59

// 共通：秒数を「HH:MM:SS」形式に変換
function formatHMS(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  if (seconds > MAX_LIMIT_SECONDS) seconds = MAX_LIMIT_SECONDS;
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ストップウォッチ用フォーマット
function formatStopwatch(centiseconds) {
  const cs = Math.floor(centiseconds % 100);
  const totalSeconds = Math.floor(centiseconds / 100);
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

// 通知送信（ON/OFF判定付き）
function sendNotification(title, body) {
  if (!('Notification' in window)) return;
  if (!document.getElementById('notifToggle').checked) return; // OFFなら送らない
  if (Notification.permission === 'granted') {
    new Notification(title, { body: body, icon: '🔔' });
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(permission => {
      if (permission === 'granted') {
        new Notification(title, { body: body, icon: '🔔' });
      }
    });
  }
}

// ============================================================
// 世界時計
// ============================================================
const cityData = [
  { city: '東京', timezone: 'Asia/Tokyo' },
  { city: 'ニューヨーク', timezone: 'America/New_York' },
  { city: 'ロンドン', timezone: 'Europe/London' },
  { city: 'パリ', timezone: 'Europe/Paris' },
  { city: 'シドニー', timezone: 'Australia/Sydney' },
  { city: '上海', timezone: 'Asia/Shanghai' },
  { city: '香港', timezone: 'Asia/Hong_Kong' },
  { city: 'ロサンゼルス', timezone: 'America/Los_Angeles' },
  { city: 'サンフランシスコ', timezone: 'America/Los_Angeles' },
  { city: 'シカゴ', timezone: 'America/Chicago' },
  { city: 'デンバー', timezone: 'America/Denver' },
  { city: 'マイアミ', timezone: 'America/New_York' },
  { city: 'メキシコシティ', timezone: 'America/Mexico_City' },
  { city: 'サンパウロ', timezone: 'America/Sao_Paulo' },
  { city: 'ブエノスアイレス', timezone: 'America/Argentina/Buenos_Aires' },
  { city: 'ダブリン', timezone: 'Europe/Dublin' },
  { city: 'ベルリン', timezone: 'Europe/Berlin' },
  { city: 'マドリード', timezone: 'Europe/Madrid' },
  { city: 'ローマ', timezone: 'Europe/Rome' },
  { city: 'モスクワ', timezone: 'Europe/Moscow' },
  { city: 'ドバイ', timezone: 'Asia/Dubai' },
  { city: 'ムンバイ', timezone: 'Asia/Kolkata' },
  { city: 'シンガポール', timezone: 'Asia/Singapore' },
  { city: 'ソウル', timezone: 'Asia/Seoul' },
  { city: '台北', timezone: 'Asia/Taipei' },
  { city: 'マニラ', timezone: 'Asia/Manila' },
  { city: 'バンコク', timezone: 'Asia/Bangkok' },
  { city: 'ジャカルタ', timezone: 'Asia/Jakarta' },
  { city: 'ホノルル', timezone: 'Pacific/Honolulu' },
  { city: 'オークランド', timezone: 'Pacific/Auckland' }
];

const citySelect = document.getElementById('citySelect');
const citySearch = document.getElementById('citySearch');
const worldClockTime = document.getElementById('worldClockTime');
const worldClockCity = document.getElementById('worldClockCity');

function populateCitySelect(filterText = '') {
  const filter = filterText.toLowerCase();
  citySelect.innerHTML = '';
  cityData.forEach(item => {
    if (item.city.toLowerCase().includes(filter)) {
      const option = document.createElement('option');
      option.value = item.timezone;
      option.textContent = item.city;
      citySelect.appendChild(option);
    }
  });
  if (citySelect.options.length === 0) {
    cityData.forEach(item => {
      const option = document.createElement('option');
      option.value = item.timezone;
      option.textContent = item.city;
      citySelect.appendChild(option);
    });
  }
}

populateCitySelect();
citySearch.addEventListener('input', (e) => populateCitySelect(e.target.value));
citySelect.addEventListener('change', () => {
  const selectedOption = citySelect.options[citySelect.selectedIndex];
  if (selectedOption) worldClockCity.textContent = selectedOption.textContent;
});

function updateWorldClock() {
  const timezone = citySelect.value;
  if (timezone) {
    const now = new Date();
    const options = { timeZone: timezone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    worldClockTime.textContent = now.toLocaleTimeString('ja-JP', options);
  }
}
setInterval(updateWorldClock, 1000);
updateWorldClock();

// ============================================================
// 汎用タイマー
// ============================================================
let timerInterval = null;
let timerRunning = false;
let timerRemainingSeconds = 0;

const timerDisplay = document.getElementById('timerDisplay');
const timerHour = document.getElementById('timerHour');
const timerMin = document.getElementById('timerMin');
const timerSec = document.getElementById('timerSec');
const timerSetBtn = document.getElementById('timerSetBtn');
const timerStartBtn = document.getElementById('timerStartBtn');
const timerStopBtn = document.getElementById('timerStopBtn');
const timerResetBtn = document.getElementById('timerResetBtn');

function timerSettings() {
  const h = parseInt(timerHour.value) || 0;
  const m = parseInt(timerMin.value) || 0;
  const s = parseInt(timerSec.value) || 0;
  let total = h * 3600 + m * 60 + s;
  if (total > MAX_LIMIT_SECONDS) total = MAX_LIMIT_SECONDS;
  return total;
}

function updateTimerDisplay() {
  timerDisplay.textContent = formatHMS(timerRemainingSeconds);
}

timerSetBtn.addEventListener('click', () => {
  stopTimer();
  timerRemainingSeconds = timerSettings();
  updateTimerDisplay();
});

timerStartBtn.addEventListener('click', () => {
  if (timerRunning) return;
  if (timerRemainingSeconds <= 0) {
    timerRemainingSeconds = timerSettings();
    updateTimerDisplay();
  }
  timerRunning = true;
  timerInterval = setInterval(() => {
    timerRemainingSeconds--;
    if (timerRemainingSeconds <= 0) {
      timerRemainingSeconds = 0;
      stopTimer();
      updateTimerDisplay();
      sendNotification('⏲️ タイマー', '時間になりました！');
      playBeep();
    } else {
      updateTimerDisplay();
    }
  }, 1000);
});

timerStopBtn.addEventListener('click', () => {
  stopTimer();
});

timerResetBtn.addEventListener('click', () => {
  stopTimer();
  timerRemainingSeconds = 0;
  updateTimerDisplay();
});

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerRunning = false;
}

// ビープ音
function playBeep() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.setValueAtTime(880, ctx.currentTime);
  gain.gain.setValueAtTime(0.3, ctx.currentTime);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.3);
}

// ============================================================
// ストップウォッチ
// ============================================================
let swInterval = null;
let swRunning = false;
let swStartTime = 0;
let swElapsed = 0;

const swDisplay = document.getElementById('stopwatchDisplay');
const swStartBtn = document.getElementById('swStart');
const swStopBtn = document.getElementById('swStop');
const swResetBtn = document.getElementById('swReset');

swStartBtn.addEventListener('click', () => {
  if (!swRunning) {
    swRunning = true;
    swStartTime = Date.now() - swElapsed * 10;
    swInterval = setInterval(() => {
      swElapsed = Math.floor((Date.now() - swStartTime) / 10);
      swDisplay.textContent = formatStopwatch(swElapsed);
    }, 10);
  }
});

swStopBtn.addEventListener('click', () => {
  if (swRunning) {
    swRunning = false;
    clearInterval(swInterval);
  }
});

swResetBtn.addEventListener('click', () => {
  swRunning = false;
  clearInterval(swInterval);
  swElapsed = 0;
  swDisplay.textContent = '00:00.00';
});

// ============================================================
// アラーム
// ============================================================
let alarmActive = false;
let alarmHour = 7;
let alarmMin = 0;
let alarmDays = [];

const alarmStatus = document.getElementById('alarmStatus');
const alarmSetBtn = document.getElementById('alarmSetBtn');

document.querySelectorAll('#alarmDays input[type="checkbox"]').forEach(cb => {
  cb.checked = (cb.value >= '1' && cb.value <= '5');
});

alarmSetBtn.addEventListener('click', () => {
  alarmHour = parseInt(document.getElementById('alarmHour').value) || 0;
  alarmMin = parseInt(document.getElementById('alarmMin').value) || 0;
  if (alarmHour > 23) alarmHour = 23;
  if (alarmMin > 59) alarmMin = 59;

  alarmDays = [];
  document.querySelectorAll('#alarmDays input[type="checkbox"]:checked').forEach(cb => {
    alarmDays.push(parseInt(cb.value));
  });

  if (alarmDays.length === 0) {
    alarmStatus.textContent = '⚠️ 曜日を選択してください';
    alarmStatus.style.color = '#f06292';
    return;
  }

  alarmActive = true;
  alarmStatus.textContent = `🔔 アラーム設定済み: ${String(alarmHour).padStart(2,'0')}:${String(alarmMin).padStart(2,'0')} (${alarmDays.map(d => ['日','月','火','水','木','金','土'][d]).join(',')})`;
  alarmStatus.style.color = '#a5d6a7';
});

function checkAlarm() {
  if (!alarmActive) return;
  const now = new Date();
  const currentHour = now.getHours();
  const currentMin = now.getMinutes();
  const currentDay = now.getDay();

  if (currentHour === alarmHour && currentMin === alarmMin && alarmDays.includes(currentDay)) {
    sendNotification('⏰ アラーム', `指定時刻になりました！ (${String(alarmHour).padStart(2,'0')}:${String(alarmMin).padStart(2,'0')})`);
    playBeep();
    alarmActive = false;
    alarmStatus.textContent = '⏰ アラームが鳴りました';
    alarmStatus.style.color = '#f06292';
  }
}
setInterval(checkAlarm, 1000);

// ============================================================
// ポモドーロタイマー
// ============================================================
let pomodoroCount = 0;
const pomodoroGrid = document.getElementById('pomodoroGrid');
const addPomodoroBtn = document.getElementById('addPomodoroBtn');

function createPomodoroTimer() {
  pomodoroCount++;
  const card = document.createElement('div');
  card.className = 'pomodoro-card';
  card.dataset.id = pomodoroCount;

  const workMinutes = 25;
  const rounds = 4;
  const loopEnabled = false;

  card.innerHTML = `
    <h3>ポモドーロ ${pomodoroCount}</h3>
    <div class="pomodoro-settings">
      <label>作業:
        <input type="number" class="pomo-work-min" min="1" max="60" value="${workMinutes}"> 分
      </label>
      <label>ラウンド:
        <input type="number" class="pomo-rounds" min="1" max="10" value="${rounds}">
      </label>
      <label>ループ:
        <select class="pomo-loop">
          <option value="false" ${!loopEnabled ? 'selected' : ''}>OFF</option>
          <option value="true" ${loopEnabled ? 'selected' : ''}>ON</option>
        </select>
      </label>
    </div>
    <div class="pomodoro-display" data-phase="work">25:00</div>
    <div class="pomodoro-controls">
      <button class="btn btn-green pomo-start">スタート</button>
      <button class="btn btn-pink pomo-pause">一時停止</button>
      <button class="btn pomo-reset">リセット</button>
      <button class="btn pomo-delete">削除</button>
    </div>
    <div class="pomodoro-status">ラウンド 0 / ${rounds}</div>
  `;

  pomodoroGrid.appendChild(card);
  initializePomodoroCard(card);
}

function initializePomodoroCard(card) {
  const display = card.querySelector('.pomodoro-display');
  const startBtn = card.querySelector('.pomo-start');
  const pauseBtn = card.querySelector('.pomo-pause');
  const resetBtn = card.querySelector('.pomo-reset');
  const deleteBtn = card.querySelector('.pomo-delete');
  const workMinInput = card.querySelector('.pomo-work-min');
  const roundsInput = card.querySelector('.pomo-rounds');
  const loopSelect = card.querySelector('.pomo-loop');
  const statusDiv = card.querySelector('.pomodoro-status');

  let timerInterval = null;
  let isRunning = false;
  let currentPhase = 'work';
  let currentRound = 0;
  let totalRounds = parseInt(roundsInput.value) || 1;
  let workSeconds = (parseInt(workMinInput.value) || 25) * 60;
  let breakSeconds = 5 * 60;
  let remainingSeconds = workSeconds;

  function updateDisplay() {
    display.textContent = formatHMS(remainingSeconds);
    statusDiv.textContent = `ラウンド ${currentRound} / ${totalRounds} (${currentPhase === 'work' ? '作業' : '休憩'})`;
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    isRunning = false;
  }

  function resetTimer() {
    stopTimer();
    currentPhase = 'work';
    currentRound = 0;
    workSeconds = (parseInt(workMinInput.value) || 25) * 60;
    remainingSeconds = workSeconds;
    updateDisplay();
  }

  function nextPhase() {
    if (currentPhase === 'work') {
      currentRound++;
      if (currentRound >= totalRounds) {
        if (loopSelect.value === 'true') {
          currentRound = 0;
          currentPhase = 'work';
          remainingSeconds = workSeconds;
          sendNotification('🍅 ポモドーロ', '全ラウンド完了！ループします');
        } else {
          sendNotification('🍅 ポモドーロ', '全ラウンド完了！お疲れ様でした');
          stopTimer();
          currentPhase = 'work';
          currentRound = 0;
          remainingSeconds = workSeconds;
          updateDisplay();
          return;
        }
      } else {
        currentPhase = 'break';
        remainingSeconds = breakSeconds;
        sendNotification('☕ 休憩', '作業完了！休憩しましょう');
      }
    } else {
      currentPhase = 'work';
      remainingSeconds = workSeconds;
      sendNotification('🍅 作業開始', '休憩終了！作業を再開しましょう');
    }
    updateDisplay();
  }

  startBtn.addEventListener('click', () => {
    if (isRunning) return;
    isRunning = true;
    timerInterval = setInterval(() => {
      remainingSeconds--;
      if (remainingSeconds <= 0) {
        nextPhase();
      }
      updateDisplay();
    }, 1000);
  });

  pauseBtn.addEventListener('click', () => {
    stopTimer();
  });

  resetBtn.addEventListener('click', () => {
    resetTimer();
  });

  deleteBtn.addEventListener('click', () => {
    // 最小1つは残す
    if (pomodoroGrid.children.length > 1) {
      stopTimer();
      card.remove();
    } else {
      alert('最低1つのポモドーロタイマーが必要です');
    }
  });

  workMinInput.addEventListener('change', () => {
    workSeconds = (parseInt(workMinInput.value) || 25) * 60;
    if (!isRunning) {
      remainingSeconds = workSeconds;
      updateDisplay();
    }
  });

  roundsInput.addEventListener('change', () => {
    totalRounds = parseInt(roundsInput.value) || 1;
    if (totalRounds < 1) totalRounds = 1;
    roundsInput.value = totalRounds;
    if (!isRunning) {
      currentRound = 0;
      updateDisplay();
    }
  });

  loopSelect.addEventListener('change', () => {
    // 設定反映は即時
  });

  updateDisplay();
}

// 初期2つ生成
createPomodoroTimer();
createPomodoroTimer();

addPomodoroBtn.addEventListener('click', () => {
  createPomodoroTimer();
});

// ============================================================
// 通知トグル初期化（許可リクエスト）
// ============================================================
const notifToggle = document.getElementById('notifToggle');
notifToggle.addEventListener('change', () => {
  if (notifToggle.checked) {
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }
});
</script>
</body>
