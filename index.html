<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイマー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="timer-container">
        
        <!-- ==========================================
           【移動】世界時計エリア（常に最上部に表示）
           ========================================== -->
        <div class="clock-section">
            <div class="search-box">
                <input type="text" id="city-search" list="timezone-list" placeholder="都市を検索 (例: Tokyo, London, New York)">
                <button id="current-location-btn" class="geo-btn" title="現在地に戻す">⌖</button>
                <datalist id="timezone-list"></datalist>
            </div>
            <div style="color: #ffea00; font-size: 0.8rem; letter-spacing: 2px; margin-top: 15px; opacity: 0.7;">MISSION CLOCK</div>
            <div id="clock-location" class="clock-location">Asia/Tokyo (現在地)</div>
            <div id="clock-display" class="clock-display">00:00:00</div>
        </div>

        <!-- 区切り線 -->
        <hr class="neon-divider">

        <!-- 【機能バー】世界時計の下に配置 -->
        <div class="nav-bar">
            <button id="nav-clock" class="nav-btn active">タイマー</button>
            <button id="nav-alarm" class="nav-btn">アラーム</button>
            <button id="nav-sw" class="nav-btn">ストップウォッチ</button>
            <button id="nav-pomodoro" class="nav-btn">ポモドーロ</button>
        </div>

        <!-- ==========================================
           1. 通常タイマー モード (デフォルト)
           ========================================== -->
        <div id="panel-clock" class="mode-panel active">
            <div class="timer-section">
                <div style="color: #00f0ff; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 5px; opacity: 0.7;">REMAINING TIME</div>
                <div class="timer-display">
                    <input type="number" id="input-hours" class="time-input" value="00" min="0" max="23" placeholder="00">
                    <span class="colon">:</span>
                    <input type="number" id="input-minutes" class="time-input" value="00" min="0" max="59" placeholder="00">
                    <span class="colon">:</span>
                    <input type="number" id="input-seconds" class="time-input" value="00" min="0" max="59" placeholder="00">
                </div>
            </div>
            <div class="button-group">
                <button id="start-btn" class="btn start">スタート</button>
                <button id="stop-btn" class="btn stop" disabled>ストップ</button>
                <button id="reset-btn" class="btn reset">リセット</button>
            </div>
        </div>

        <!-- ==========================================
           2. アラーム モード
           ========================================== -->
        <div id="panel-alarm" class="mode-panel">
            <div style="color: #ff9f00; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 15px; opacity: 0.7;">ALARM SYSTEM</div>
            <div class="alarm-setup">
                <input type="time" id="alarm-time" class="alarm-input" step="1">
            </div>
            <div id="alarm-status" class="status-text">アラーム未設定</div>
            <div class="button-group" style="margin-top: 25px;">
                <button id="alarm-start-btn" class="btn start">スタート</button>
                <button id="alarm-stop-btn" class="btn stop" disabled>停止</button>
            </div>
        </div>

        <!-- ==========================================
           3. ストップウォッチ モード
           ========================================== -->
        <div id="panel-sw" class="mode-panel">
            <div style="color: #00ffcc; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 15px; opacity: 0.7;">STOPWATCH</div>
            <div id="sw-display" class="sw-display">00:00:00<span class="sw-ms">.00</span></div>
            <div class="button-group" style="margin-top: 25px;">
                <button id="sw-start-btn" class="btn start">スタート</button>
                <button id="sw-stop-btn" class="btn stop" disabled>ストップ</button>
                <button id="sw-reset-btn" class="btn reset">リセット</button>
            </div>
        </div>

        <!-- ==========================================
           4. ポモドーロタイマー モード
           ========================================== -->
        <div id="panel-pomodoro" class="mode-panel">
            <div style="color: #ff00ff; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 10px; opacity: 0.7;">AUTOMATIC POMODORO</div>
            
            <div class="pomo-settings">
                <div class="pomo-set-box">
                    <span>作業(分)</span>
                    <input type="number" id="pomo-work-input" value="25" min="1" max="60">
                </div>
                <div class="pomo-set-box">
                    <span>休憩(分)</span>
                    <input type="number" id="pomo-break-input" value="5" min="1" max="60">
                </div>
            </div>

            <div id="pomo-phase" class="pomo-phase">STANDBY</div>
            <div id="pomo-display" class="pomo-display">25:00</div>
            <div id="pomo-round" class="status-text">ROUND: 1 / 4</div>

            <div class="button-group" style="margin-top: 25px;">
                <button id="pomo-start-btn" class="btn start">スタート</button>
                <button id="pomo-stop-btn" class="btn stop" disabled>ストップ</button>
                <button id="pomo-reset-btn" class="btn reset">リセット</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
