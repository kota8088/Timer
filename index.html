<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Multi Timer</title>
<style>
  :root {
    --neon-cyan: #00f0ff;
    --neon-pink: #ff00e5;
    --neon-purple: #b026ff;
    --neon-green: #39ff14;
    --neon-yellow: #ffe600;
    --bg: #0a0a12;
    --panel: rgba(20, 20, 35, 0.75);
    --border: rgba(0, 240, 255, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 10%, #1a0b2e 0%, #0a0a12 55%, #05050a 100%);
    color: #e6f7ff;
    font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    padding: 20px;
    overflow-x: hidden;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    letter-spacing: 4px;
    color: var(--neon-cyan);
    text-shadow: 0 0 8px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px rgba(0,240,255,0.4);
    margin: 0 0 20px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 0 15px rgba(0,240,255,0.15), inset 0 0 20px rgba(0,240,255,0.05);
    backdrop-filter: blur(6px);
  }

  .panel-title {
    font-size: 0.9rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--neon-pink);
    text-shadow: 0 0 6px var(--neon-pink), 0 0 12px rgba(255,0,229,0.5);
    margin-bottom: 12px;
  }

  /* ===== 通知設定パネル ===== */
  #notifPanel {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: rgba(255,0,229,0.06);
    border: 1px solid rgba(255,0,229,0.35);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 18px;
    box-shadow: 0 0 15px rgba(255,0,229,0.15);
  }

  #notifPanel .notif-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    color: #ffd6f7;
    text-shadow: 0 0 6px rgba(255,0,229,0.4);
    letter-spacing: 1px;
  }

  #notifPanel .notif-icon {
    font-size: 1.2rem;
    filter: drop-shadow(0 0 6px var(--neon-pink));
  }

  #notifPanel .status-text {
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid currentColor;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  #notifPanel .status-text.on {
    color: var(--neon-green);
    text-shadow: 0 0 6px var(--neon-green);
  }
  #notifPanel .status-text.off {
    color: #888;
  }
  #notifPanel .status-text.blocked {
    color: var(--neon-pink);
    text-shadow: 0 0 6px var(--neon-pink);
  }

  #notifPanel .spacer { flex: 1; }

  /* ===== 大きなトグルスイッチ ===== */
  .big-switch {
    position: relative;
    width: 68px;
    height: 34px;
    border-radius: 17px;
    background: rgba(0,0,0,0.55);
    border: 1px solid #555;
    cursor: pointer;
    transition: all 0.25s;
    flex-shrink: 0;
  }
  .big-switch::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #666;
    transition: all 0.25s;
    box-shadow: 0 0 6px rgba(0,0,0,0.6);
  }
  .big-switch.on {
    background: rgba(57,255,20,0.2);
    border-color: var(--neon-green);
    box-shadow: 0 0 14px var(--neon-green), inset 0 0 12px rgba(57,255,20,0.3);
  }
  .big-switch.on::after {
    left: 37px;
    background: var(--neon-green);
    box-shadow: 0 0 14px var(--neon-green);
  }
  .big-switch.disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  /* ===== 世界時計 ===== */
  #clockList { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }

  .clock-card {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(176,38,255,0.4);
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 170px;
    position: relative;
    box-shadow: 0 0 10px rgba(176,38,255,0.25);
  }
  .clock-card .city { font-size: 0.8rem; color: var(--neon-purple); text-shadow: 0 0 6px var(--neon-purple); letter-spacing: 1px; }
  .clock-card .time { font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
  .clock-card .date { font-size: 0.7rem; opacity: 0.6; }
  .clock-card .remove { position: absolute; top: 4px; right: 8px; cursor: pointer; color: var(--neon-pink); font-size: 1rem; }

  /* ===== 検索ボックス & ドロップダウン ===== */
  .search-wrap { position: relative; }

  #tzSearch {
    width: 100%;
    padding: 12px 14px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #e6f7ff;
    font-size: 0.95rem;
    outline: none;
    box-shadow: 0 0 8px rgba(0,240,255,0.2);
    cursor: pointer;
    transition: all 0.2s;
  }
  #tzSearch:focus,
  #tzSearch.open {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 14px var(--neon-cyan);
  }
  #tzSearch::placeholder { color: rgba(230, 247, 255, 0.4); }

  #tzResults {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: rgba(10,10,25,0.98);
    border: 1px solid var(--neon-cyan);
    border-radius: 10px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 50;
    display: none;
    box-shadow: 0 0 25px rgba(0,240,255,0.5), inset 0 0 20px rgba(0,240,255,0.05);
    animation: dropIn 0.18s ease-out;
  }
  #tzResults.open { display: block; }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #tzResults .tz-item {
    padding: 9px 14px;
    cursor: pointer;
    font-size: 0.85rem;
    border-bottom: 1px solid rgba(0,240,255,0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    transition: background 0.12s;
  }
  #tzResults .tz-item:last-child { border-bottom: none; }
  #tzResults .tz-item:hover,
  #tzResults .tz-item.active {
    background: rgba(0,240,255,0.15);
    color: var(--neon-cyan);
    text-shadow: 0 0 6px var(--neon-cyan);
  }
  #tzResults .tz-item .tz-name { flex: 1; }
  #tzResults .tz-item .tz-offset {
    font-size: 0.72rem;
    color: var(--neon-purple);
    text-shadow: 0 0 5px var(--neon-purple);
    font-variant-numeric: tabular-nums;
  }
  #tzResults .tz-item.added { opacity: 0.45; }
  #tzResults .tz-item.added .tz-name::after {
    content: ' ✓';
    color: var(--neon-green);
    text-shadow: 0 0 6px var(--neon-green);
  }

  #tzResults .tz-group {
    padding: 6px 14px;
    font-size: 0.68rem;
    letter-spacing: 1.5px;
    color: var(--neon-pink);
    text-shadow: 0 0 5px var(--neon-pink);
    background: rgba(255,0,229,0.06);
    position: sticky;
    top: 0;
    z-index: 2;
    backdrop-filter: blur(4px);
  }

  #tzResults .tz-empty {
    padding: 16px;
    text-align: center;
    font-size: 0.82rem;
    opacity: 0.6;
  }

  /* ===== ボタン ===== */
  button {
    font-family: inherit; padding: 9px 18px; border-radius: 8px;
    border: 1px solid var(--neon-cyan);
    background: rgba(0,240,255,0.08);
    color: var(--neon-cyan); cursor: pointer; font-size: 0.9rem; letter-spacing: 1px;
    text-shadow: 0 0 6px var(--neon-cyan);
    box-shadow: 0 0 8px rgba(0,240,255,0.3), inset 0 0 8px rgba(0,240,255,0.1);
    transition: all 0.2s;
  }
  button:hover:not(:disabled) { background: rgba(0,240,255,0.25); box-shadow: 0 0 16px var(--neon-cyan), inset 0 0 12px rgba(0,240,255,0.3); }
  button:active:not(:disabled) { transform: scale(0.96); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  button.pink { border-color: var(--neon-pink); color: var(--neon-pink); text-shadow: 0 0 6px var(--neon-pink); box-shadow: 0 0 8px rgba(255,0,229,0.3); background: rgba(255,0,229,0.08); }
  button.pink:hover:not(:disabled) { background: rgba(255,0,229,0.22); box-shadow: 0 0 16px var(--neon-pink); }

  button.green { border-color: var(--neon-green); color: var(--neon-green); text-shadow: 0 0 6px var(--neon-green); box-shadow: 0 0 8px rgba(57,255,20,0.3); background: rgba(57,255,20,0.08); }
  button.green:hover:not(:disabled) { background: rgba(57,255,20,0.22); box-shadow: 0 0 16px var(--neon-green); }

  button.small { padding: 5px 10px; font-size: 0.78rem; }

  /* ===== 時間入力マス ===== */
  .time-input { display: inline-flex; align-items: center; gap: 4px; }
  .time-input input {
    width: 60px; text-align: center; font-size: 2rem;
    font-variant-numeric: tabular-nums;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--neon-cyan);
    border-radius: 8px; color: var(--neon-cyan);
    text-shadow: 0 0 8px var(--neon-cyan);
    padding: 4px; outline: none;
    box-shadow: inset 0 0 10px rgba(0,240,255,0.2);
    font-family: inherit;
  }
  .time-input input::-webkit-outer-spin-button,
  .time-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .time-input input[type=number] { -moz-appearance: textfield; }

  .time-input input:focus {
    border-color: var(--neon-pink); color: var(--neon-pink);
    text-shadow: 0 0 8px var(--neon-pink);
    box-shadow: inset 0 0 10px rgba(255,0,229,0.25);
  }
  .time-input .colon { font-size: 2rem; color: var(--neon-purple); text-shadow: 0 0 8px var(--neon-purple); }

  .time-display {
    font-size: 2.6rem; font-variant-numeric: tabular-nums;
    color: var(--neon-green);
    text-shadow: 0 0 10px var(--neon-green), 0 0 25px rgba(57,255,20,0.5);
    letter-spacing: 2px;
  }

  .row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }

  /* ===== ストップウォッチ ===== */
  #swDisplay {
    font-size: 3rem; font-variant-numeric: tabular-nums;
    color: var(--neon-yellow);
    text-shadow: 0 0 10px var(--neon-yellow), 0 0 25px rgba(255,230,0,0.5);
    letter-spacing: 2px;
  }
  #swDisplay .ms { font-size: 1.6rem; opacity: 0.85; }

  /* ===== 曜日選択 ===== */
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .day-btn {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(176,38,255,0.5);
    background: rgba(0,0,0,0.4);
    color: #8a8aa8; cursor: pointer; font-size: 0.9rem;
    transition: all 0.15s; user-select: none;
  }
  .day-btn.active {
    color: #fff; border-color: var(--neon-purple);
    background: rgba(176,38,255,0.3);
    box-shadow: 0 0 12px var(--neon-purple), inset 0 0 10px rgba(176,38,255,0.4);
    text-shadow: 0 0 6px #fff;
  }

  /* ===== アラーム/インターバルリスト ===== */
  .alarm-item, .interval-item {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px;
    border: 1px solid rgba(0,240,255,0.2);
    border-radius: 10px; margin-bottom: 8px;
    background: rgba(0,0,0,0.3);
  }

  .alarm-item .alarm-days { display: flex; gap: 4px; font-size: 0.75rem; }
  .alarm-item .alarm-days span { padding: 2px 5px; border-radius: 5px; background: rgba(176,38,255,0.15); color: #8a8aa8; }
  .alarm-item .alarm-days span.on { background: rgba(176,38,255,0.5); color: #fff; text-shadow: 0 0 5px var(--neon-purple); }

  .alarm-time-inputs input {
    width: 48px; text-align: center; font-size: 1.2rem;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--neon-cyan);
    border-radius: 6px; color: var(--neon-cyan);
    padding: 4px; outline: none; font-family: inherit;
  }
  .alarm-time-inputs input::-webkit-outer-spin-button,
  .alarm-time-inputs input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .alarm-time-inputs input[type=number] { -moz-appearance: textfield; }

  .switch {
    position: relative; width: 42px; height: 22px; border-radius: 11px;
    background: rgba(0,0,0,0.5);
    border: 1px solid var(--neon-cyan);
    cursor: pointer; transition: 0.2s;
    flex-shrink: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #556; transition: 0.2s;
  }
  .switch.on { background: rgba(57,255,20,0.25); border-color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }
  .switch.on::after { left: 22px; background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }

  label { font-size: 0.85rem; opacity: 0.85; }
  .hint { font-size: 0.78rem; opacity: 0.55; margin-top: 6px; }

  #toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(20,10,40,0.95);
    border: 1px solid var(--neon-pink);
    color: #fff; padding: 14px 28px; border-radius: 10px;
    font-size: 1rem; box-shadow: 0 0 25px var(--neon-pink);
    text-shadow: 0 0 8px var(--neon-pink);
    transition: transform 0.4s;
    z-index: 999; pointer-events: none;
    max-width: 90vw;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  .interval-item .idx {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(176,38,255,0.25);
    border: 1px solid var(--neon-purple);
    color: #fff; font-size: 0.8rem;
    box-shadow: 0 0 8px rgba(176,38,255,0.5);
    flex-shrink: 0;
  }
  .interval-item.active { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(57,255,20,0.4); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,240,255,0.4); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,240,255,0.6); }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<h1>◆ NEON MULTI TIMER ◆</h1>

<!-- ========== 通知設定パネル ========== -->
<div id="notifPanel">
  <div class="notif-label">
    <span class="notif-icon">🔔</span>
    デスクトップ通知
  </div>
  <div class="big-switch on" id="notifToggle"></div>
  <span class="status-text on" id="notifStatusText">ON</span>
  <div class="spacer"></div>
  <button class="small" id="notifTest">テスト通知</button>
  <button class="pink small" id="notifRequest">ブラウザで許可</button>
</div>

<!-- ========== 世界時計 ========== -->
<div class="panel">
  <div class="panel-title">🌍 世界時計</div>
  <div class="search-wrap">
    <input type="text" id="tzSearch" placeholder="クリックしてタイムゾーンを選択 / 入力で絞り込み" autocomplete="off">
    <div id="tzResults"></div>
  </div>
  <div id="clockList"></div>
</div>

<!-- ========== タイマー ========== -->
<div class="panel">
  <div class="panel-title">⏱ タイマー</div>
  <div class="time-input" id="timerInputWrap" style="margin-bottom:12px;">
    <input type="number" id="tH" min="0" max="23" value="0" placeholder="00">
    <span class="colon">:</span>
    <input type="number" id="tM" min="0" max="59" value="0" placeholder="00">
    <span class="colon">:</span>
    <input type="number" id="tS" min="0" max="59" value="0" placeholder="00">
  </div>
  <div class="time-display" id="timerDisplay" style="display:none;">00:00:00</div>
  <div class="row">
    <button class="green" id="timerStart">スタート</button>
    <button class="pink" id="timerStop">ストップ</button>
    <button id="timerReset">停止(リセット)</button>
  </div>
  <div class="hint">上限 23:59:59 / 「停止」で元の入力時間に戻ります</div>
</div>

<!-- ========== ストップウォッチ ========== -->
<div class="panel">
  <div class="panel-title">⏲ ストップウォッチ</div>
  <div id="swDisplay">00:00:00<span class="ms">.00</span></div>
  <div class="row" style="margin-top:12px;">
    <button class="green" id="swStart">スタート</button>
    <button class="pink" id="swStop">ストップ</button>
    <button id="swReset">リセット</button>
  </div>
</div>

<!-- ========== アラーム ========== -->
<div class="panel">
  <div class="panel-title">⏰ アラーム (週周期 / 1回のみ)</div>
  <div class="row" style="margin-bottom:10px;">
    <div class="alarm-time-inputs">
      <input type="number" id="alH" min="0" max="23" value="7" placeholder="00">
      <span style="color:var(--neon-purple);">:</span>
      <input type="number" id="alM" min="0" max="59" value="0" placeholder="00">
    </div>
    <div class="days" id="alDays">
      <div class="day-btn" data-d="1">月</div>
      <div class="day-btn" data-d="2">火</div>
      <div class="day-btn" data-d="3">水</div>
      <div class="day-btn" data-d="4">木</div>
      <div class="day-btn" data-d="5">金</div>
      <div class="day-btn" data-d="6">土</div>
      <div class="day-btn" data-d="0">日</div>
    </div>
    <button class="green small" id="alAdd">＋ 追加</button>
  </div>
  <div class="hint" style="margin-bottom:10px;">曜日を選択しない = 1回のみ / 選択 = 週周期</div>
  <div id="alarmList"></div>
</div>

<!-- ========== インターバルタイマー ========== -->
<div class="panel">
  <div class="panel-title">🔁 インターバルタイマー</div>
  <div id="intervalList"></div>
  <div class="row" style="margin-top:10px;">
    <button class="green" id="ivAdd">＋ 追加</button>
    <button class="green" id="ivStart">スタート</button>
    <button class="pink" id="ivStop">ストップ</button>
    <button id="ivReset">停止(リセット)</button>
  </div>
  <div class="hint">各マスごとに時間入力 / 上から順に実行</div>
</div>

<div id="toast"></div>

<script>
/* =========================================================
   通知設定 (ON/OFF 切り替え + localStorage 保存)
========================================================= */
const notifToggle     = document.getElementById('notifToggle');
const notifStatusText = document.getElementById('notifStatusText');
const notifTest       = document.getElementById('notifTest');
const notifRequest    = document.getElementById('notifRequest');

const NOTIF_SUPPORTED = 'Notification' in window;
const NOTIF_PREF_KEY  = 'neon-timer-notif-enabled';

// ON/OFF 設定 (ユーザーがトグルで切り替える) を localStorage から復元
let notifEnabled = (localStorage.getItem(NOTIF_PREF_KEY) !== 'off'); // デフォルト ON

function isNotifActuallyActive() {
  return NOTIF_SUPPORTED && notifEnabled && Notification.permission === 'granted';
}

function renderNotifPanel() {
  // トグルの見た目
  if (!NOTIF_SUPPORTED) {
    notifToggle.classList.remove('on');
    notifToggle.classList.add('disabled');
    notifStatusText.textContent = '非対応';
    notifStatusText.className = 'status-text blocked';
    notifTest.disabled = true;
    notifRequest.disabled = true;
    return;
  }

  notifToggle.classList.toggle('on', notifEnabled);

  if (!notifEnabled) {
    notifStatusText.textContent = 'OFF';
    notifStatusText.className = 'status-text off';
    notifTest.disabled = true;
    notifRequest.disabled = false;
  } else if (Notification.permission === 'granted') {
    notifStatusText.textContent = 'ON';
    notifStatusText.className = 'status-text on';
    notifTest.disabled = false;
    notifRequest.disabled = true;
  } else if (Notification.permission === 'denied') {
    notifStatusText.textContent = 'ブロック中';
    notifStatusText.className = 'status-text blocked';
    notifTest.disabled = true;
    notifRequest.disabled = false;
  } else {
    // permission === 'default'
    notifStatusText.textContent = '要許可';
    notifStatusText.className = 'status-text blocked';
    notifTest.disabled = true;
    notifRequest.disabled = false;
  }
}

// トグルクリック
notifToggle.onclick = () => {
  if (!NOTIF_SUPPORTED) { toast('このブラウザは通知非対応です'); return; }
  notifEnabled = !notifEnabled;
  localStorage.setItem(NOTIF_PREF_KEY, notifEnabled ? 'on' : 'off');
  renderNotifPanel();

  if (notifEnabled) {
    // ONにした時にまだ許可されていなければリクエスト
    if (Notification.permission === 'default') {
      requestNotifPermission();
    } else if (Notification.permission === 'granted') {
      toast('🔔 通知を ON にしました');
    } else if (Notification.permission === 'denied') {
      toast('⚠ ブラウザでブロックされています。「ブラウザで許可」から設定してください');
    }
  } else {
    toast('🔕 通知を OFF にしました');
  }
};

// テスト通知
notifTest.onclick = () => {
  if (!isNotifActuallyActive()) {
    toast('通知が有効ではありません');
    return;
  }
  showDesktopNotification('🔔 テスト通知', 'Neon Multi Timer からの通知テストです');
  toast('テスト通知を送信しました');
};

// ブラウザで許可
notifRequest.onclick = () => {
  if (!NOTIF_SUPPORTED) { toast('このブラウザは通知非対応です'); return; }
  if (Notification.permission === 'granted') { toast('すでに許可されています'); return; }
  requestNotifPermission();
};

async function requestNotifPermission() {
  if (!NOTIF_SUPPORTED) return;
  if (Notification.permission === 'denied') {
    toast('ブラウザ設定で通知を許可してください');
    return;
  }
  const res = await Notification.requestPermission();
  renderNotifPanel();
  if (res === 'granted') {
    toast('🔔 通知を許可しました');
    showDesktopNotification('通知が有効になりました', 'Neon Multi Timer');
  } else {
    toast('通知が許可されませんでした');
  }
}

// デスクトップ通知送信 (設定 + 許可 をチェック)
function showDesktopNotification(title, body, opts = {}) {
  if (!isNotifActuallyActive()) return;
  try {
    const n = new Notification(title, {
      body: body || '',
      icon: 'data:image/svg+xml;utf8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128">
           <rect width="128" height="128" rx="24" fill="#0a0a12"/>
           <circle cx="64" cy="64" r="44" fill="none" stroke="#00f0ff" stroke-width="6"/>
           <line x1="64" y1="64" x2="64" y2="36" stroke="#00f0ff" stroke-width="6" stroke-linecap="round"/>
           <line x1="64" y1="64" x2="88" y2="72" stroke="#ff00e5" stroke-width="6" stroke-linecap="round"/>
         </svg>`
      ),
      tag: opts.tag || 'neon-timer',
      requireInteraction: opts.requireInteraction || false,
      silent: true,
    });
    n.onclick = () => { window.focus(); n.close(); };
    if (!opts.requireInteraction) {
      setTimeout(() => { try { n.close(); } catch(e){} }, 8000);
    }
  } catch (e) {}
}

renderNotifPanel();

/* =========================================================
   画面内トースト + ビープ音
========================================================= */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3500);
  beep();
}

function beep(times = 1) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < times; i++) {
      const t = ctx.currentTime + i * 0.35;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.32);
    }
  } catch(e) {}
}

function notifyAll(title, body, opts = {}) {
  // デスクトップ通知は showDesktopNotification 内でON/OFF判定される
  showDesktopNotification(title, body, opts);
  // 画面内トーストは常に表示(通知ON/OFFとは独立)
  toast((opts.icon || '') + ' ' + title + (body ? ' - ' + body : ''));
}

/* =========================================================
   世界時計 (クリックでドロップダウン表示)
========================================================= */
const tzList = (typeof Intl.supportedValuesOf === 'function')
  ? Intl.supportedValuesOf('timeZone')
  : ['Asia/Tokyo','America/New_York','Europe/London','Europe/Paris','Asia/Seoul','Asia/Shanghai','Australia/Sydney','America/Los_Angeles','Asia/Dubai','America/Sao_Paulo'];

const clockList = document.getElementById('clockList');
const tzSearch  = document.getElementById('tzSearch');
const tzResults = document.getElementById('tzResults');
let clocks = [
  { tz: 'Asia/Tokyo', label: 'Tokyo' },
  { tz: 'America/New_York', label: 'New York' },
  { tz: 'Europe/London', label: 'London' }
];

function cityFromTz(tz) { return tz.split('/').pop().replace(/_/g, ' '); }

function getOffsetStr(tz) {
  try {
    const now = new Date();
    const dtf = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, timeZoneName: 'shortOffset'
    });
    const parts = dtf.formatToParts(now);
    const off = parts.find(p => p.type === 'timeZoneName');
    if (off) return off.value.replace('GMT', 'UTC');
  } catch(e) {}
  return '';
}

function groupTz(tz) {
  const region = tz.split('/')[0];
  const map = {
    'Africa': 'アフリカ',
    'America': 'アメリカ',
    'Antarctica': '南極',
    'Arctic': '北極',
    'Asia': 'アジア',
    'Atlantic': '大西洋',
    'Australia': 'オーストラリア',
    'Europe': 'ヨーロッパ',
    'Indian': 'インド洋',
    'Pacific': '太平洋',
    'Etc': 'その他',
    'US': 'アメリカ(旧)',
  };
  return map[region] || region;
}

let tzFiltered = [];
let tzActiveIndex = -1;

function renderTzDropdown(filter = '') {
  const q = filter.trim().toLowerCase();

  if (q) {
    tzFiltered = tzList.filter(tz => tz.toLowerCase().includes(q));
  } else {
    tzFiltered = [...tzList];
  }

  tzResults.innerHTML = '';

  if (tzFiltered.length === 0) {
    tzResults.innerHTML = '<div class="tz-empty">該当するタイムゾーンがありません</div>';
    return;
  }

  const groups = {};
  tzFiltered.forEach(tz => {
    const g = groupTz(tz);
    if (!groups[g]) groups[g] = [];
    groups[g].push(tz);
  });

  const order = ['アジア','ヨーロッパ','アメリカ','オセアニア','アフリカ','太平洋','大西洋','インド洋','その他'];
  const sortedGroups = Object.keys(groups).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  sortedGroups.forEach(gName => {
    const header = document.createElement('div');
    header.className = 'tz-group';
    header.textContent = gName;
    tzResults.appendChild(header);

    groups[gName].forEach(tz => {
      const item = document.createElement('div');
      item.className = 'tz-item';
      const already = clocks.some(c => c.tz === tz);
      if (already) item.classList.add('added');
      item.innerHTML = `
        <span class="tz-name">${tz.replace(/_/g, ' ')}</span>
        <span class="tz-offset">${getOffsetStr(tz)}</span>
      `;
      item.dataset.tz = tz;
      item.onclick = (e) => {
        e.stopPropagation();
        selectTz(tz);
      };
      tzResults.appendChild(item);
    });
  });
}

function openTzDropdown() {
  tzSearch.classList.add('open');
  tzResults.classList.add('open');
  renderTzDropdown(tzSearch.value);
  tzActiveIndex = -1;
}

function closeTzDropdown() {
  tzSearch.classList.remove('open');
  tzResults.classList.remove('open');
  tzActiveIndex = -1;
}

function selectTz(tz) {
  if (!clocks.some(c => c.tz === tz)) {
    clocks.push({ tz, label: cityFromTz(tz) });
    renderClocks();
  } else {
    toast('そのタイムゾーンは既に追加されています');
  }
  tzSearch.value = '';
  renderTzDropdown('');
}

function renderClocks() {
  clockList.innerHTML = '';
  clocks.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'clock-card';
    card.innerHTML = `
      <span class="remove" data-i="${i}">✕</span>
      <div class="city">${c.label}</div>
      <div class="time">--:--:--</div>
      <div class="date">---</div>
    `;
    clockList.appendChild(card);
  });
  clockList.querySelectorAll('.remove').forEach(el => {
    el.onclick = () => { clocks.splice(+el.dataset.i, 1); renderClocks(); };
  });
  updateClocks();
}

function updateClocks() {
  const now = new Date();
  const cards = clockList.children;
  clocks.forEach((c, i) => {
    const card = cards[i];
    if (!card) return;
    try {
      const time = now.toLocaleTimeString('ja-JP', { timeZone: c.tz, hour12: false });
      const date = now.toLocaleDateString('ja-JP', { timeZone: c.tz, month: 'short', day: 'numeric', weekday: 'short' });
      card.querySelector('.time').textContent = time;
      card.querySelector('.date').textContent = date;
    } catch(e) {
      card.querySelector('.time').textContent = 'ERR';
    }
  });
}
setInterval(updateClocks, 1000);

tzSearch.addEventListener('focus', openTzDropdown);
tzSearch.addEventListener('click', openTzDropdown);
tzSearch.addEventListener('input', () => {
  if (!tzResults.classList.contains('open')) openTzDropdown();
  renderTzDropdown(tzSearch.value);
  tzActiveIndex = -1;
});

tzSearch.addEventListener('keydown', e => {
  const items = [...tzResults.querySelectorAll('.tz-item')];
  if (!items.length) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    tzActiveIndex = Math.min(tzActiveIndex + 1, items.length - 1);
    updateActiveItem(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    tzActiveIndex = Math.max(tzActiveIndex - 1, 0);
    updateActiveItem(items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (tzActiveIndex >= 0 && items[tzActiveIndex]) {
      selectTz(items[tzActiveIndex].dataset.tz);
    }
  } else if (e.key === 'Escape') {
    closeTzDropdown();
    tzSearch.blur();
  }
});

function updateActiveItem(items) {
  items.forEach((it, i) => it.classList.toggle('active', i === tzActiveIndex));
  if (items[tzActiveIndex]) items[tzActiveIndex].scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', e => {
  if (!tzSearch.contains(e.target) && !tzResults.contains(e.target)) {
    closeTzDropdown();
  }
});

renderClocks();

/* =========================================================
   タイマー
========================================================= */
const tH = document.getElementById('tH');
const tM = document.getElementById('tM');
const tS = document.getElementById('tS');
const timerDisplay = document.getElementById('timerDisplay');
const timerInputWrap = document.getElementById('timerInputWrap');
let timerId = null;
let timerRemaining = 0;
let timerRunning = false;

function clampInput(el, max) {
  el.addEventListener('input', () => {
    let v = parseInt(el.value) || 0;
    if (v < 0) v = 0;
    if (v > max) v = max;
    el.value = v;
  });
}
clampInput(tH, 23); clampInput(tM, 59); clampInput(tS, 59);

function fmtHMS(sec) {
  const h = String(Math.floor(sec / 3600)).padStart(2,'0');
  const m = String(Math.floor((sec % 3600) / 60)).padStart(2,'0');
  const s = String(sec % 60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}
function getTimerInputSec() {
  return (parseInt(tH.value)||0)*3600 + (parseInt(tM.value)||0)*60 + (parseInt(tS.value)||0);
}

document.getElementById('timerStart').onclick = () => {
  if (timerRunning) return;
  if (timerRemaining === 0) {
    timerRemaining = getTimerInputSec();
    if (timerRemaining <= 0) { toast('時間を入力してください'); return; }
  }
  timerRunning = true;
  timerInputWrap.style.display = 'none';
  timerDisplay.style.display = 'block';
  timerDisplay.textContent = fmtHMS(timerRemaining);

  timerId = setInterval(() => {
    timerRemaining--;
    timerDisplay.textContent = fmtHMS(timerRemaining);
    if (timerRemaining <= 0) {
      clearInterval(timerId);
      timerRunning = false;
      notifyAll('⏱ タイマー終了', '設定した時間になりました', { tag: 'timer', requireInteraction: true, icon: '⏱' });
      beep(2);
    }
  }, 1000);
};

document.getElementById('timerStop').onclick = () => {
  clearInterval(timerId);
  timerRunning = false;
};

document.getElementById('timerReset').onclick = () => {
  clearInterval(timerId);
  timerRunning = false;
  timerRemaining = 0;
  timerDisplay.style.display = 'none';
  timerInputWrap.style.display = 'inline-flex';
};

/* =========================================================
   ストップウォッチ
========================================================= */
const swDisplay = document.getElementById('swDisplay');
let swStartTime = 0, swElapsed = 0, swId = null, swRunning = false;

function fmtSW(ms) {
  const total = Math.floor(ms);
  const h = String(Math.floor(total / 3600000)).padStart(2,'0');
  const m = String(Math.floor((total % 3600000) / 60000)).padStart(2,'0');
  const s = String(Math.floor((total % 60000) / 1000)).padStart(2,'0');
  const cs = String(Math.floor((total % 1000) / 10)).padStart(2,'0');
  return `${h}:${m}:${s}<span class="ms">.${cs}</span>`;
}
function updateSW() {
  const now = performance.now();
  const elapsed = swElapsed + (swRunning ? now - swStartTime : 0);
  swDisplay.innerHTML = fmtSW(elapsed);
}

document.getElementById('swStart').onclick = () => {
  if (swRunning) return;
  swRunning = true;
  swStartTime = performance.now();
  swId = setInterval(updateSW, 33);
};
document.getElementById('swStop').onclick = () => {
  if (!swRunning) return;
  swElapsed += performance.now() - swStartTime;
  swRunning = false;
  clearInterval(swId);
  updateSW();
};
document.getElementById('swReset').onclick = () => {
  swRunning = false;
  clearInterval(swId);
  swElapsed = 0;
  swDisplay.innerHTML = fmtSW(0);
};

/* =========================================================
   アラーム
========================================================= */
const alDaysEl = document.getElementById('alDays');
let alarms = [];
let alarmSeq = 0;

alDaysEl.querySelectorAll('.day-btn').forEach(btn => {
  btn.onclick = () => btn.classList.toggle('active');
});
function getSelectedDays() {
  return [...alDaysEl.querySelectorAll('.day-btn.active')].map(b => +b.dataset.d);
}
document.getElementById('alAdd').onclick = () => {
  const h = Math.min(23, Math.max(0, parseInt(document.getElementById('alH').value)||0));
  const m = Math.min(59, Math.max(0, parseInt(document.getElementById('alM').value)||0));
  const days = getSelectedDays();
  alarms.push({ id: ++alarmSeq, h, m, days: [...days], enabled: true, lastTriggered: null });
  alDaysEl.querySelectorAll('.day-btn.active').forEach(b => b.classList.remove('active'));
  renderAlarms();
};

const DAY_NAMES = ['日','月','火','水','木','金','土'];

function renderAlarms() {
  const list = document.getElementById('alarmList');
  list.innerHTML = '';
  if (alarms.length === 0) {
    list.innerHTML = '<div class="hint">アラームはまだありません</div>';
    return;
  }
  alarms.forEach(a => {
    const el = document.createElement('div');
    el.className = 'alarm-item';
    const daysHtml = DAY_NAMES.map((n, i) =>
      `<span class="${a.days.includes(i) ? 'on' : ''}">${n}</span>`
    ).join('');
    el.innerHTML = `
      <div class="switch ${a.enabled ? 'on' : ''}" data-toggle="${a.id}"></div>
      <div style="font-size:1.4rem;color:var(--neon-cyan);text-shadow:0 0 8px var(--neon-cyan);font-variant-numeric:tabular-nums;">
        ${String(a.h).padStart(2,'0')}:${String(a.m).padStart(2,'0')}
      </div>
      <div class="alarm-days">${daysHtml}</div>
      <div class="hint" style="flex:1;">
        ${a.days.length === 0 ? '1回のみ' : '週周期'}
      </div>
      <button class="pink small" data-del="${a.id}">削除</button>
    `;
    list.appendChild(el);
  });
  list.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = () => {
      const a = alarms.find(x => x.id === +el.dataset.toggle);
      a.enabled = !a.enabled;
      renderAlarms();
    };
  });
  list.querySelectorAll('[data-del]').forEach(el => {
    el.onclick = () => {
      alarms = alarms.filter(x => x.id !== +el.dataset.del);
      renderAlarms();
    };
  });
}
renderAlarms();

setInterval(() => {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes(), d = now.getDay();
  const key = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${h}-${m}`;

  alarms.forEach(a => {
    if (!a.enabled) return;
    if (a.h !== h || a.m !== m) return;
    if (a.lastTriggered === key) return;

    const timeStr = `${String(a.h).padStart(2,'0')}:${String(a.m).padStart(2,'0')}`;
    if (a.days.length === 0) {
      notifyAll('⏰ アラーム', `${timeStr} (1回のみ)`, { tag: 'alarm-' + a.id, requireInteraction: true, icon: '⏰' });
      a.enabled = false;
      renderAlarms();
    } else if (a.days.includes(d)) {
      notifyAll('⏰ アラーム', `${timeStr} (${DAY_NAMES[d]}曜日)`, { tag: 'alarm-' + a.id, requireInteraction: true, icon: '⏰' });
    }
    beep(2);
    a.lastTriggered = key;
  });
}, 1000);

/* =========================================================
   インターバルタイマー
========================================================= */
let intervals = [
  { id: 1, h: 0, m: 0, s: 10 },
  { id: 2, h: 0, m: 0, s: 5 }
];
let ivSeq = 1;
let ivRunning = false;
let ivCurrentIndex = -1;
let ivRemaining = 0;
let ivId = null;

const ivList = document.getElementById('intervalList');

function renderIntervals() {
  ivList.innerHTML = '';
  if (intervals.length === 0) {
    ivList.innerHTML = '<div class="hint">インターバルを追加してください</div>';
    return;
  }
  intervals.forEach((iv, i) => {
    const el = document.createElement('div');
    el.className = 'interval-item' + (ivRunning && i === ivCurrentIndex ? ' active' : '');
    el.innerHTML = `
      <div class="idx">${i+1}</div>
      <div class="time-input">
        <input type="number" min="0" max="23" value="${iv.h}" data-iv="${iv.id}" data-f="h" style="width:52px;font-size:1.2rem;">
        <span class="colon" style="font-size:1.2rem;">:</span>
        <input type="number" min="0" max="59" value="${iv.m}" data-iv="${iv.id}" data-f="m" style="width:52px;font-size:1.2rem;">
        <span class="colon" style="font-size:1.2rem;">:</span>
        <input type="number" min="0" max="59" value="${iv.s}" data-iv="${iv.id}" data-f="s" style="width:52px;font-size:1.2rem;">
      </div>
      <div class="hint" style="flex:1;" data-ivdisp="${iv.id}"></div>
      <button class="pink small" data-ivdel="${iv.id}">削除</button>
    `;
    ivList.appendChild(el);
  });

  ivList.querySelectorAll('input[data-iv]').forEach(inp => {
    inp.oninput = () => {
      const id = +inp.dataset.iv;
      const f = inp.dataset.f;
      const iv = intervals.find(x => x.id === id);
      let v = parseInt(inp.value) || 0;
      if (f === 'h') v = Math.min(23, Math.max(0, v));
      else v = Math.min(59, Math.max(0, v));
      inp.value = v;
      iv[f] = v;
    };
  });

  ivList.querySelectorAll('[data-ivdel]').forEach(btn => {
    btn.onclick = () => {
      if (ivRunning) { toast('実行中は削除できません'); return; }
      const id = +btn.dataset.ivdel;
      intervals = intervals.filter(x => x.id !== id);
      renderIntervals();
    };
  });

  updateIvDisplays();
}

function updateIvDisplays() {
  ivList.querySelectorAll('[data-ivdisp]').forEach(el => {
    const id = +el.dataset.ivdisp;
    if (ivRunning && ivCurrentIndex >= 0 && intervals[ivCurrentIndex] && intervals[ivCurrentIndex].id === id) {
      el.textContent = '▶ ' + fmtHMS(ivRemaining);
      el.style.color = 'var(--neon-green)';
      el.style.textShadow = '0 0 8px var(--neon-green)';
      el.style.opacity = 1;
    } else {
      el.textContent = '';
    }
  });
}

document.getElementById('ivAdd').onclick = () => {
  if (ivRunning) { toast('実行中は追加できません'); return; }
  intervals.push({ id: ++ivSeq, h: 0, m: 0, s: 10 });
  renderIntervals();
};

document.getElementById('ivStart').onclick = () => {
  if (ivRunning) return;
  if (intervals.length === 0) { toast('インターバルを追加してください'); return; }
  ivRunning = true;
  ivCurrentIndex = 0;
  runIvStep();
};

function runIvStep() {
  if (ivCurrentIndex >= intervals.length) {
    ivRunning = false;
    ivCurrentIndex = -1;
    notifyAll('🔁 インターバル完了', '全ステップが終了しました', { tag: 'interval', requireInteraction: true, icon: '🔁' });
    beep(2);
    renderIntervals();
    return;
  }
  const iv = intervals[ivCurrentIndex];
  ivRemaining = iv.h*3600 + iv.m*60 + iv.s;
  if (ivRemaining <= 0) { ivCurrentIndex++; runIvStep(); return; }
  renderIntervals();
  updateIvDisplays();

  clearInterval(ivId);
  ivId = setInterval(() => {
    ivRemaining--;
    updateIvDisplays();
    if (ivRemaining <= 0) {
      clearInterval(ivId);
      showDesktopNotification(
        `🔔 ステップ ${ivCurrentIndex+1} 完了`,
        `次はステップ ${ivCurrentIndex+2} です`,
        { tag: 'iv-step-' + ivCurrentIndex, icon: '🔔' }
      );
      toast(`🔔 ステップ ${ivCurrentIndex+1} 完了`);
      beep();
      ivCurrentIndex++;
      setTimeout(() => { if (ivRunning) runIvStep(); }, 400);
    }
  }, 1000);
}

document.getElementById('ivStop').onclick = () => {
  clearInterval(ivId);
  ivRunning = false;
};

document.getElementById('ivReset').onclick = () => {
  clearInterval(ivId);
  ivRunning = false;
  ivCurrentIndex = -1;
  ivRemaining = 0;
  renderIntervals();
};

renderIntervals();

/* 初期表示 */
updateSW();
</script>
