<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ネオン・コスモ・タイマー</title>
    <style>
        /* 全体デザイン・テーマ */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a2a; /* 深い宇宙のようなダークブルー */
            color: #e0e0e0; /* 明るめのテキストカラー */
            margin: 0;
            padding: 20px;
            overflow-x: hidden; /* 横スクロールバーを無効化 */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; /* 画面の高さいっぱいに広げる */
        }

        /* ネオンエフェクト */
        .neon-text {
            color: #fff;
            text-shadow:
                0 0 5px #00ffff, /* シアン */
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 30px #00ffff,
                0 0 40px #00ffff,
                0 0 50px #00ffff,
                0 0 60px #00ffff;
        }

        .neon-button {
            background-color: transparent;
            border: 2px solid #00ffff; /* ネオンブルー */
            color: #00ffff;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff;
        }

        .neon-button:hover {
            background-color: #00ffff;
            color: #0a0a2a; /* 背景色に合わせる */
            box-shadow: 0 0 12px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
        }

        .neon-input, .neon-select {
            background-color: transparent;
            border: 2px solid #00ff00; /* ネオングリーン */
            color: #00ff00;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 5px;
            font-size: 16px;
            box-shadow: 0 0 8px #00ff00, 0 0 15px #00ff00;
        }

        .neon-input::placeholder, .neon-select::placeholder {
            color: #008800; /* 暗めのネオングリーン */
        }

        .neon-input:focus, .neon-select:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 12px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00;
        }

        .neon-label {
            color: #ff00ff; /* ネオンピンク */
            font-weight: bold;
            margin: 5px;
            text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            background-color: rgba(10, 10, 40, 0.6); /* 半透明のダーク背景 */
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), 0 0 40px rgba(255, 0, 255, 0.3); /* ネオン調の影 */
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        h1, h2, h3 {
            color: #00ffff; /* ネオンブルー */
            text-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 世界時計セクション */
        #world-clock-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        #world-clock-controls {
            display: flex;
            flex-wrap: wrap; /* 要素が溢れたら折り返す */
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }

        #city-search {
            width: 250px; /* 検索バーの幅 */
            flex-shrink: 0; /* 縮小させない */
        }

        #city-select {
            width: 250px; /* ドロップダウンの幅 */
            flex-shrink: 0; /* 縮小させない */
        }

        #current-time-display {
            font-size: 3em; /* 大きめのフォントサイズ */
            font-weight: bold;
            margin-top: 10px;
            color: #00ff00; /* ネオングリーン */
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 30px #00ff00;
        }

        /* ストップウォッチセクション */
        #stopwatch-section .container-inner {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #stopwatch-display {
            font-size: 4em;
            font-weight: bold;
            margin: 20px 0;
            color: #ff00ff; /* ネオンピンク */
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
        }

        #stopwatch-controls button {
            margin: 0 10px;
            padding: 15px 30px;
            font-size: 20px;
        }

        /* アラームセクション */
        #alarm-section .container-inner {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #alarm-time-input, #alarm-label-input {
            width: 200px;
            margin-right: 10px;
        }

        #alarm-days label {
            margin: 0 5px;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        #alarm-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
            width: 100%;
            text-align: center;
        }

        #alarm-list li {
            background-color: rgba(0, 255, 255, 0.1);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #00ffff;
            box-shadow: 0 0 5px #00ffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #alarm-list li span {
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }

        #alarm-list li button {
            padding: 5px 10px;
            font-size: 14px;
        }

        /* ポモドーロタイマーセクション */
        #pomodoro-section .container-inner {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #pomodoro-templates {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .pomodoro-timer {
            background-color: rgba(255, 0, 255, 0.1); /* ネオンピンク基調 */
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 280px; /* 最低限の幅 */
            margin-bottom: 20px; /* ポモドーロ間の下マージン */
        }

        .pomodoro-timer h3 {
            color: #ff00ff; /* ネオンピンク */
            margin-top: 0;
        }

        .pomodoro-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 15px;
        }

        .pomodoro-controls label,
        .pomodoro-controls input[type="number"],
        .pomodoro-controls input[type="checkbox"] {
            margin: 5px;
            font-size: 16px;
        }

        .pomodoro-controls input[type="number"] {
            width: 60px;
            text-align: center;
        }

        .pomodoro-display {
            font-size: 3em;
            font-weight: bold;
            margin: 15px 0;
            color: #00ffff; /* ネオンブルー */
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
        }

        .pomodoro-timer-buttons button {
            margin: 5px;
            padding: 8px 15px;
            font-size: 14px;
        }

        .pomodoro-loop-toggle {
            margin-top: 15px;
            display: flex;
            align-items: center;
        }

        .pomodoro-loop-toggle label {
            color: #00ff00; /* ネオングリーン */
            text-shadow: 0 0 5px #00ff00;
            margin-left: 10px;
        }

        #add-pomodoro-button {
            margin-top: 20px;
            width: 200px;
            padding: 12px 25px;
            font-size: 18px;
        }

        /* 共通のタイマー設定 */
        .timer-config {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .timer-config label {
            margin-right: 10px;
        }

        .timer-config input[type="number"] {
            width: 70px;
            text-align: center;
        }

        .timer-config select {
            margin-left: 10px;
        }

        /* Utility Classes */
        .section-title {
            font-size: 2.5em;
            margin-bottom: 25px;
        }

        .controls-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        .time-input-group {
            display: flex;
            align-items: center;
            margin: 5px 10px;
        }

        .time-input-group label {
            margin-right: 5px;
        }

        .time-input-group input[type="number"] {
            width: 50px;
            text-align: center;
            background-color: transparent;
            border: 2px solid #00ff00;
            color: #00ff00;
            box-shadow: 0 0 5px #00ff00;
        }

        .time-input-group input[type="number"]:focus {
            outline: none;
            box-shadow: 0 0 8px #00ff00, 0 0 15px #00ff00;
        }

        .time-input-group select {
            background-color: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            box-shadow: 0 0 5px #00ffff;
            padding: 3px 5px;
        }

        .time-input-group select:focus {
            outline: none;
            box-shadow: 0 0 8px #00ffff, 0 0 15px #00ffff;
        }

        .reset-button {
            background-color: #ff0000; /* 赤色で注意喚起 */
            border-color: #ff0000;
            box-shadow: 0 0 8px #ff0000, 0 0 15px #ff0000;
        }

        .reset-button:hover {
            background-color: #cc0000;
            border-color: #cc0000;
            box-shadow: 0 0 12px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
        }

        /* デスクトップ通知の許可を求めるメッセージ */
        .notification-prompt {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #eee;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 0, 0.7);
            z-index: 1000;
            display: none; /* 初期状態は非表示 */
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .notification-prompt.show {
            display: block;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="neon-text">ネオン・コスモ・タイマー</h1>

        <!-- ① 世界時計 -->
        <section id="world-clock-section">
            <h2 class="neon-text">世界時計</h2>
            <div class="container-inner">
                <div id="world-clock-controls">
                    <input type="text" id="city-search" class="neon-input" placeholder="都市名で検索...">
                    <select id="city-select" class="neon-select">
                        <option value="Asia/Tokyo">東京</option>
                        <option value="America/New_York">ニューヨーク</option>
                        <option value="Europe/London">ロンドン</option>
                        <option value="Europe/Paris">パリ</option>
                        <option value="Asia/Shanghai">上海</option>
                        <option value="Australia/Sydney">シドニー</option>
                        <option value="America/Los_Angeles">ロサンゼルス</option>
                        <option value="America/Chicago">シカゴ</option>
                        <option value="Europe/Berlin">ベルリン</option>
                        <option value="Asia/Dubai">ドバイ</option>
                        <option value="Asia/Kolkata">コルカタ</option>
                        <option value="America/Mexico_City">メキシコシティ</option>
                        <option value="America/Sao_Paulo">サンパウロ</option>
                        <option value="Africa/Cairo">カイロ</option>
                        <option value="Asia/Singapore">シンガポール</option>
                        <option value="Asia/Seoul">ソウル</option>
                        <option value="Asia/Hong_Kong">香港</option>
                        <option value="Europe/Moscow">モスクワ</option>
                        <option value="America/Anchorage">アンカレッジ</option>
                        <option value="Pacific/Honolulu">ホノルル</option>
                    </select>
                </div>
                <div id="current-time-display" class="neon-text">--:--:--</div>
            </div>
        </section>

        <!-- ③ ストップウォッチ -->
        <section id="stopwatch-section">
            <h2 class="neon-text">ストップウォッチ</h2>
            <div class="container-inner">
                <div id="stopwatch-display" class="neon-text">00:00:00.00</div>
                <div id="stopwatch-controls" class="controls-group">
                    <button id="start-stopwatch" class="neon-button">スタート</button>
                    <button id="reset-stopwatch" class="neon-button reset-button">リセット</button>
                </div>
            </div>
        </section>
    </div>

    <div class="container">
        <!-- ④ アラーム機能 -->
        <section id="alarm-section">
            <h2 class="neon-text">アラーム</h2>
            <div class="container-inner">
                <div class="timer-config">
                    <label for="alarm-time-input" class="neon-label">時刻:</label>
                    <input type="time" id="alarm-time-input" class="neon-input" value="07:00">

                    <label for="alarm-label-input" class="neon-label">ラベル:</label>
                    <input type="text" id="alarm-label-input" class="neon-input" placeholder="アラーム名...">

                    <button id="add-alarm" class="neon-button">アラーム追加</button>
                </div>
                <div id="alarm-days" class="timer-config">
                    <label class="neon-label">曜日:</label>
                    <label><input type="checkbox" value="Mon"> 月</label>
                    <label><input type="checkbox" value="Tue"> 火</label>
                    <label><input type="checkbox" value="Wed"> 水</label>
                    <label><input type="checkbox" value="Thu"> 木</label>
                    <label><input type="checkbox" value="Fri"> 金</label>
                    <label><input type="checkbox" value="Sat"> 土</label>
                    <label><input type="checkbox" value="Sun"> 日</label>
                </div>
                <ul id="alarm-list">
                    <!-- アラームがここに追加されます -->
                </ul>
            </div>
        </section>
    </div>

    <div class="container">
        <!-- ⑤ ポモドーロタイマー -->
        <section id="pomodoro-section">
            <h2 class="neon-text">ポモドーロタイマー</h2>
            <div class="container-inner">
                <div id="pomodoro-templates">
                    <!-- 初期状態のポモドーロタイマーがここに生成されます -->
                </div>
                <button id="add-pomodoro-button" class="neon-button">ポモドーロタイマーを追加</button>
            </div>
        </section>
    </div>

    <!-- デスクトップ通知の許可を求めるメッセージ -->
    <div id="notification-prompt" class="notification-prompt">
        このアプリはデスクトップ通知を使用します。通知の許可をお願いします。
    </div>

    <script>
        // --- グローバル変数 ---
        let stopwatchInterval; // ストップウォッチのインターバルID
        let stopwatchSeconds = 0; // ストップウォッチの経過秒数
        let worldClockInterval; // 世界時計のインターバルID
        let alarms = []; // アラームの配列
        let alarmInterval; // アラームチェックのインターバルID
        let nextPomodoroId = 0; // ポモドーロタイマーのユニークID
        const MAX_TIME_SECONDS = 23 * 60 * 60 + 59 * 60 + 59; // 23:59:59 を秒で表現

        // --- Notification API 関連 ---
        let notificationPermissionGranted = false;

        // 通知の許可を求める関数
        function requestNotificationPermission() {
            if (!('Notification' in window)) {
                console.warn('このブラウザはデスクトップ通知をサポートしていません。');
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    notificationPermissionGranted = true;
                    console.log('通知の許可が得られました。');
                    document.getElementById('notification-prompt').classList.remove('show');
                } else if (permission === 'denied') {
                    console.log('通知の許可が得られませんでした。');
                    document.getElementById('notification-prompt').innerText = '通知の許可が得られませんでした。設定から許可してください。';
                    document.getElementById('notification-prompt').classList.add('show');
                } else { // 'default'
                    console.log('通知の許可が保留されています。');
                    document.getElementById('notification-prompt').classList.add('show');
                }
            });
        }

        // デスクトップ通知を表示する関数
        function showDesktopNotification(title, body) {
            if (!notificationPermissionGranted) {
                console.log('通知は許可されていません。');
                return;
            }
            new Notification(title, { body: body, icon: '' }); // iconは必要に応じて設定
        }

        // --- フォーマットヘルパー ---
        // 秒数を HH:MM:SS.ms 形式に変換する関数
        function formatTime(totalSeconds) {
            const ms = Math.round((totalSeconds - Math.floor(totalSeconds)) * 100);
            const seconds = Math.floor(totalSeconds);
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;

            const paddedH = String(h).padStart(2, '0');
            const paddedM = String(m).padStart(2, '0');
            const paddedS = String(s).padStart(2, '0');
            const paddedMs = String(ms).padStart(2, '0');

            return `${paddedH}:${paddedM}:${paddedS}.${paddedMs}`;
        }

        // 時分秒の合計秒数を計算する関数
        function calculateTotalSeconds(h, m, s) {
            return h * 3600 + m * 60 + s;
        }

        // 秒数を HH:MM:SS 形式に変換する関数
        function formatTimeHMS(totalSeconds) {
            const seconds = Math.floor(totalSeconds);
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;

            const paddedH = String(h).padStart(2, '0');
            const paddedM = String(m).padStart(2, '0');
            const paddedS = String(s).padStart(2, '0');

            return `${paddedH}:${paddedM}:${paddedS}`;
        }

        // --- 時間単位の切り替えとバリデーション ---
        const MAX_HOURS = 23;
        const MAX_MINUTES = 59;
        const MAX_SECONDS = 59;

        // 指定された時間（秒）が最大値を超えないように補正する関数
        function clampTimeToMax(totalSeconds) {
            if (totalSeconds > MAX_TIME_SECONDS) {
                return MAX_TIME_SECONDS;
            }
            return totalSeconds;
        }

        // --- ① 世界時計 ---
        const citySelect = document.getElementById('city-select');
        const citySearchInput = document.getElementById('city-search');
        const currentTimeDisplay = document.getElementById('current-time-display');

        // 都市リスト（IANA Time Zone Database Names）
        const timezones = {
            "東京": "Asia/Tokyo", "ニューヨーク": "America/New_York", "ロンドン": "Europe/London",
            "パリ": "Europe/Paris", "上海": "Asia/Shanghai", "シドニー": "Australia/Sydney",
            "ロサンゼルス": "America/Los_Angeles", "シカゴ": "America/Chicago", "ベルリン": "Europe/Berlin",
            "ドバイ": "Asia/Dubai", "コルカタ": "Asia/Kolkata", "メキシコシティ": "America/Mexico_City",
            "サンパウロ": "America/Sao_Paulo", "カイロ": "Africa/Cairo", "シンガポール": "Asia/Singapore",
            "ソウル": "Asia/Seoul", "香港": "Asia/Hong_Kong", "モスクワ": "Europe/Moscow",
            "アンカレッジ": "America/Anchorage", "ホノルル": "Pacific/Honolulu"
        };

        // ドロップダウンに都市名を追加（検索機能のため）
        const initialOptions = Array.from(citySelect.options).map(option => ({ value: option.value, text: option.text }));
        function populateCitySelect(filter = '') {
            citySelect.innerHTML = ''; // 一度クリア
            const filteredOptions = initialOptions.filter(option =>
                option.text.toLowerCase().includes(filter.toLowerCase())
            );
            filteredOptions.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option.value;
                opt.textContent = option.text;
                citySelect.appendChild(opt);
            });
        }

        // 検索バーのイベントリスナー
        citySearchInput.addEventListener('input', () => {
            populateCitySelect(citySearchInput.value);
        });

        // 現在時刻を表示する関数
        function updateWorldClock() {
            const selectedTimezone = citySelect.value;
            if (!selectedTimezone) return;

            try {
                const now = new Date();
                const options = { timeZone: selectedTimezone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
                const timeString = now.toLocaleTimeString('ja-JP', options);
                currentTimeDisplay.textContent = timeString;
            } catch (error) {
                console.error("タイムゾーンの取得に失敗しました:", error);
                currentTimeDisplay.textContent = "エラー";
            }
        }

        // 世界時計の初期設定とインターバル開始
        citySelect.addEventListener('change', updateWorldClock);
        populateCitySelect(); // 初期表示
        updateWorldClock(); // 初回表示
        worldClockInterval = setInterval(updateWorldClock, 1000); // 1秒ごとに更新

        // --- ③ ストップウォッチ ---
        const startStopwatchButton = document.getElementById('start-stopwatch');
        const resetStopwatchButton = document.getElementById('reset-stopwatch');
        const stopwatchDisplay = document.getElementById('stopwatch-display');

        let isStopwatchRunning = false;

        // ストップウォッチの更新関数
        function updateStopwatch() {
            stopwatchSeconds += 0.01; // 1/100秒単位で加算
            stopwatchDisplay.textContent = formatTime(stopwatchSeconds);
        }

        // スタート/ストップボタンのクリックイベント
        startStopwatchButton.addEventListener('click', () => {
            if (isStopwatchRunning) {
                clearInterval(stopwatchInterval);
                startStopwatchButton.textContent = '再開';
            } else {
                stopwatchInterval = setInterval(updateStopwatch, 10); // 10ミリ秒ごとに更新
                startStopwatchButton.textContent = 'ストップ';
            }
            isStopwatchRunning = !isStopwatchRunning;
        });

        // リセットボタンのクリックイベント
        resetStopwatchButton.addEventListener('click', () => {
            clearInterval(stopwatchInterval);
            isStopwatchRunning = false;
            stopwatchSeconds = 0;
            stopwatchDisplay.textContent = formatTime(stopwatchSeconds);
            startStopwatchButton.textContent = 'スタート';
        });

        // --- ④ アラーム機能 ---
        const alarmTimeInput = document.getElementById('alarm-time-input');
        const alarmLabelInput = document.getElementById('alarm-label-input');
        const addAlarmButton = document.getElementById('add-alarm');
        const alarmDaysCheckboxes = document.querySelectorAll('#alarm-days input[type="checkbox"]');
        const alarmList = document.getElementById('alarm-list');

        // アラームをリストに追加する関数
        function addAlarmToDOM(alarm) {
            const li = document.createElement('li');
            li.dataset.id = alarm.id;

            const timeSpan = document.createElement('span');
            timeSpan.textContent = `${alarm.time} (${alarm.label || 'アラーム'}) - ${alarm.days.join(', ')}`;

            const deleteButton = document.createElement('button');
            deleteButton.textContent = '削除';
            deleteButton.classList.add('neon-button', 'reset-button');
            deleteButton.addEventListener('click', () => {
                deleteAlarm(alarm.id);
                li.remove();
            });

            li.appendChild(timeSpan);
            li.appendChild(deleteButton);
            alarmList.appendChild(li);
        }

        // アラームを追加する関数
        function addAlarm() {
            const time = alarmTimeInput.value; // HH:MM形式
            const label = alarmLabelInput.value.trim();
            const selectedDays = Array.from(alarmDaysCheckboxes)
                .filter(checkbox => checkbox.checked)
                .map(checkbox => checkbox.value);

            if (!time) {
                alert('時刻を入力してください。');
                return;
            }

            const newAlarm = {
                id: Date.now(), // ユニークなID
                time: time,
                label: label,
                days: selectedDays.length > 0 ? selectedDays : ['毎日'] // 曜日が選択されていなければ「毎日」
            };
            alarms.push(newAlarm);
            addAlarmToDOM(newAlarm);

            alarmTimeInput.value = '07:00'; // 初期化
            alarmLabelInput.value = '';
            alarmDaysCheckboxes.forEach(cb => cb.checked = false);
        }

        // アラームを削除する関数
        function deleteAlarm(id) {
            alarms = alarms.filter(alarm => alarm.id !== id);
        }

        // アラームをチェックする関数
        function checkAlarms() {
            const now = new Date();
            const currentDay = now.toDateString().split(' ')[0]; // 例: 'Mon'
            const currentTime = now.toTimeString().substring(0, 5); // HH:MM形式

            alarms.forEach(alarm => {
                // 毎日アラームの場合、または今日の曜日が設定されている場合
                if (alarm.days.includes('毎日') || alarm.days.includes(currentDay)) {
                    if (alarm.time === currentTime) {
                        // 既に鳴らしたアラームは重複して鳴らさないようにフラグ管理も可能だが、ここではシンプルに
                        alert(`アラーム: ${alarm.label || '指定時刻です'}`);
                        showDesktopNotification('アラーム', `${alarm.label || '指定時刻です'} - ${alarm.time}`);

                        // 一度鳴らしたら、その日の同じ時刻のアラームは無効にする（または削除する）
                        // ここでは、シンプルにアラートと通知のみ。必要に応じてタイマーリセットや削除処理を追加
                    }
                }
            });
        }

        // アラーム追加ボタンのイベントリスナー
        addAlarmButton.addEventListener('click', addAlarm);

        // アラームチェックのインターバル開始
        alarmInterval = setInterval(checkAlarms, 1000); // 1秒ごとにチェック

        // --- ⑤ ポモドーロタイマー ---

        // ポモドーロタイマーのHTMLを生成する関数
        function createPomodoroTimerHTML(id, workTime = 25, roundCount = 4, loopEnabled = true) {
            const timerDiv = document.createElement('div');
            timerDiv.classList.add('pomodoro-timer');
            timerDiv.dataset.id = id;

            timerDiv.innerHTML = `
                <h3 class="neon-text">ポモドーロ ${id + 1}</h3>
                <div class="timer-config">
                    <label class="neon-label">作業時間:</label>
                    <input type="number" class="pomodoro-work-time" min="1" max="59" value="${workTime}"> 分
                    <label class="neon-label">休憩時間:</label>
                    <input type="number" class="pomodoro-break-time" min="1" max="59" value="5"> 分
                </div>
                <div class="timer-config">
                    <label class="neon-label">ラウンド数:</label>
                    <input type="number" class="pomodoro-round-count" min="1" max="10" value="${roundCount}">
                </div>
                <div class="pomodoro-display neon-text">--:--</div>
                <div class="pomodoro-controls">
                    <button class="neon-button start-pomodoro">スタート</button>
                    <button class="neon-button reset-pomodoro">リセット</button>
                </div>
                <div class="pomodoro-loop-toggle">
                    <input type="checkbox" class="pomodoro-loop-toggle-checkbox" ${loopEnabled ? 'checked' : ''}>
                    <label class="neon-label">ループする</label>
                </div>
            `;
            return timerDiv;
        }

        // ポモドーロタイマーの初期化（2つ）
        function initializePomodoros() {
            const pomodoroTemplates = document.getElementById('pomodoro-templates');
            for (let i = 0; i < 2; i++) {
                const timerElement = createPomodoroTimerHTML(nextPomodoroId++);
                pomodoroTemplates.appendChild(timerElement);
                setupPomodoroEventListeners(timerElement);
            }
        }

        // ポモドーロタイマーのイベントリスナーを設定する関数
        function setupPomodoroEventListeners(timerElement) {
            const startButton = timerElement.querySelector('.start-pomodoro');
            const resetButton = timerElement.querySelector('.reset-pomodoro');
            const display = timerElement.querySelector('.pomodoro-display');
            const workTimeInput = timerElement.querySelector('.pomodoro-work-time');
            const breakTimeInput = timerElement.querySelector('.pomodoro-break-time');
            const roundCountInput = timerElement.querySelector('.pomodoro-round-count');
            const loopCheckbox = timerElement.querySelector('.pomodoro-loop-toggle-checkbox');

            let pomodoroInterval;
            let currentSeconds;
            let isPomodoroRunning = false;
            let isWorkTime = true; // true: 作業中, false: 休憩中
            let currentRound = 0;
            let totalRounds = parseInt(roundCountInput.value);
            let workDuration = parseInt(workTimeInput.value) * 60;
            let breakDuration = parseInt(breakTimeInput.value) * 60;

            // 表示を更新する関数
            function updatePomodoroDisplay() {
                display.textContent = formatTimeHMS(currentSeconds);
            }

            // タイマーをリセットする関数
            function resetPomodoro() {
                clearInterval(pomodoroInterval);
                isPomodoroRunning = false;
                isWorkTime = true;
                currentRound = 0;
                workDuration = parseInt(workTimeInput.value) * 60;
                breakDuration = parseInt(breakTimeInput.value) * 60;
                totalRounds = parseInt(roundCountInput.value);
                currentSeconds = workDuration; // 初期状態は作業時間
                updatePomodoroDisplay();
                startButton.textContent = 'スタート';
            }

            // タイマーのカウントダウン関数
            function countdownPomodoro() {
                currentSeconds--;

                if (currentSeconds < 0) {
                    if (isWorkTime) {
                        // 作業時間終了
                        showDesktopNotification('ポモドーロ', '作業時間が終了しました。休憩開始！');
                        currentRound++;
                        isWorkTime = false;
                        currentSeconds = breakDuration; // 休憩時間へ
                        if (currentRound >= totalRounds && !loopCheckbox.checked) {
                            // 最終ラウンド終了、ループしない場合
                            resetPomodoro();
                            alert('ポモドーロ終了！');
                            return;
                        }
                        if (loopCheckbox.checked && currentRound >= totalRounds) {
                            // ループする場合、ラウンド数をリセット
                            currentRound = 0;
                        }
                    } else {
                        // 休憩時間終了
                        showDesktopNotification('ポモドーロ', '休憩時間が終了しました。作業開始！');
                        isWorkTime = true;
                        currentSeconds = workDuration; // 作業時間へ
                    }
                }
                updatePomodoroDisplay();
            }

            // スタート/ストップボタンのイベント
            startButton.addEventListener('click', () => {
                if (!isPomodoroRunning) {
                    // 初期化または再開
                    workDuration = parseInt(workTimeInput.value) * 60;
                    breakDuration = parseInt(breakTimeInput.value) * 60;
                    totalRounds = parseInt(roundCountInput.value);

                    if (currentSeconds === undefined || currentSeconds === workDuration || currentSeconds <= 0) {
                        // 初回起動またはリセット後
                        currentSeconds = workDuration;
                        isWorkTime = true;
                        currentRound = 0; // リセット時にラウンドもリセット
                    }

                    isPomodoroRunning = true;
                    startButton.textContent = 'ストップ';
                    pomodoroInterval = setInterval(countdownPomodoro, 1000); // 1秒ごとに更新
                    updatePomodoroDisplay(); // 即時反映
                } else {
                    // ストップ
                    clearInterval(pomodoroInterval);
                    isPomodoroRunning = false;
                    startButton.textContent = '再開';
                }
            });

            // リセットボタンのイベント
            resetButton.addEventListener('click', () => {
                resetPomodoro();
            });

            // 時間入力フィールドの変更イベント（バリデーション付き）
            const updateDurations = () => {
                workDuration = parseInt(workTimeInput.value) * 60;
                breakDuration = parseInt(breakTimeInput.value) * 60;
                totalRounds = parseInt(roundCountInput.value);

                // 現在のタイマーが作業時間中なら、表示を更新
                if (isWorkTime && isPomodoroRunning) {
                    currentSeconds = clampToMax(workDuration); // 最大値補正
                    updatePomodoroDisplay();
                } else if (!isWorkTime && isPomodoroRunning) {
                    currentSeconds = clampToMax(breakDuration); // 最大値補正
                    updatePomodoroDisplay();
                } else if (!isPomodoroRunning) {
                    // タイマーが停止している場合、リセット時と同じように表示を更新
                    currentSeconds = workDuration;
                    updatePomodoroDisplay();
                }
            };

            workTimeInput.addEventListener('change', updateDurations);
            breakTimeInput.addEventListener('change', updateDurations);
            roundCountInput.addEventListener('change', () => {
                totalRounds = parseInt(roundCountInput.value);
                if (!isPomodoroRunning && isWorkTime) { // タイマー停止中かつ作業時間表示の場合
                    currentSeconds = workDuration;
                    updatePomodoroDisplay();
                }
            });

            // 初期表示設定
            resetPomodoro();
        }

        // ポモドーロタイマー追加ボタンのイベント
        document.getElementById('add-pomodoro-button').addEventListener('click', () => {
            const pomodoroTemplates = document.getElementById('pomodoro-templates');
            const newTimerElement = createPomodoroTimerHTML(nextPomodoroId++);
            pomodoroTemplates.appendChild(newTimerElement);
            setupPomodoroEventListeners(newTimerElement);
        });

        // --- 初期化処理 ---
        initializePomodoros(); // 初期ポモドーロタイマーを生成
        requestNotificationPermission(); // 通知の許可を求める

    </script>
</body>
</html>
