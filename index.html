<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイマー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 通知切り替えスイッチ -->
        <div class="notification-toggle">
            <label class="switch">
                <input type="checkbox" id="notification-checkbox">
                <span class="slider"></span>
            </label>
            <span class="toggle-label">デスクトップ通知</span>
        </div>

        <!-- リアルタイム時計セクション -->
        <header class="neon-section neon-cyan">
            <h2>REALTIME CLOCK</h2>
            <div id="clock-display" class="neon-text">00:00:00</div>
            <div class="search-box">
                <input type="text" id="timezone-search" placeholder="都市名を入力 (例: London, Tokyo, New York)">
                <button id="search-btn">検索</button>
            </div>
            <div id="timezone-label">現在の場所: アジア / 東京</div>
        </header>

        <!-- グリッドレイアウト（各機能のマス） -->
        <div class="grid-container">
            <!-- 1. タイマー -->
            <section class="neon-section neon-green">
                <h3>TIMER</h3>
                <div class="time-inputs">
                    <input type="number" id="timer-min" min="0" max="99" value="3"><span>分</span>
                    <input type="number" id="timer-sec" min="0" max="59" value="0"><span>秒</span>
                </div>
                <div id="timer-display" class="neon-text-sub">03:00</div>
                <div class="btn-group">
                    <button id="timer-start">スタート</button>
                    <button id="timer-stop">停止</button>
                </div>
            </section>

            <!-- 2. ストップウォッチ -->
            <section class="neon-section neon-pink">
                <h3>STOPWATCH</h3>
                <div id="sw-display" class="neon-text-sub">00:00.00</div>
                <div class="btn-group sw-buttons">
                    <button id="sw-toggle">スタート</button>
                    <button id="sw-lap" disabled>ラップ</button>
                    <button id="sw-reset">リセット</button>
                </div>
                <!-- ラップ保存エリア（スクロール可能） -->
                <div class="lap-container">
                    <ul id="lap-list"></ul>
                </div>
            </section>

            <!-- 3. アラーム -->
            <section class="neon-section neon-yellow">
                <h3>ALARM</h3>
                <div class="time-inputs">
                    <input type="time" id="alarm-time" value="07:00">
                </div>
                <div id="alarm-status">アラーム未設定</div>
                <div class="btn-group">
                    <button id="alarm-set">設定</button>
                    <button id="alarm-clear">解除</button>
                </div>
            </section>

            <!-- 4. ポモドーロタイマー -->
            <section class="neon-section neon-purple">
                <h3>POMODORO</h3>
                <div class="pomo-settings">
                    <div class="setting-item">
                        <label>作業:</label>
                        <input type="number" id="pomo-work" min="1" max="60" value="25">分
                    </div>
                    <div class="setting-item">
                        <label>休憩:</label>
                        <input type="number" id="pomo-break" min="1" max="60" value="5">分
                    </div>
                    <div class="setting-item">
                        <label>目標:</label>
                        <input type="number" id="pomo-rounds" min="1" max="10" value="4">回
                    </div>
                </div>
                <div id="pomo-phase" class="pomo-phase-text">集中時間</div>
                <div id="pomo-display" class="neon-text-sub">25:00</div>
                <div id="pomo-round-display">ラウンド: 1 / 4</div>
                <div class="btn-group">
                    <button id="pomo-start">スタート</button>
                    <button id="pomo-stop">停止</button>
                </div>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
