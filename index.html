<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON TIMER - 多機能タイマー</title>
<style>
/* ===== 全体デザイン（宇宙・ネオン） ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', 'Orbitron', sans-serif;
}

body {
  background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
  min-height: 100vh;
  color: #fff;
  overflow-x: hidden;
  position: relative;
}

/* 星の背景 */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: 
    radial-gradient(2px 2px at 20px 30px, #eee, transparent),
    radial-gradient(2px 2px at 40px 70px, #fff, transparent),
    radial-gradient(1px 1px at 90px 40px, #fff, transparent),
    radial-gradient(2px 2px at 130px 80px, #eee, transparent),
    radial-gradient(2px 2px at 160px 120px, #fff, transparent),
    radial-gradient(1px 1px at 200px 50px, #fff, transparent);
  background-size: 250px 250px;
  opacity: 0.3;
  animation: twinkle 5s infinite alternate;
  pointer-events: none;
}

@keyframes twinkle {
  from { opacity: 0.2; }
  to { opacity: 0.5; }
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
  z-index: 1;
}

h1 {
  text-align: center;
  font-size: 2.5rem;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: #00d4ff;
  text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff, 0 0 40px #00d4ff;
  margin-bottom: 30px;
}

h2 {
  color: #ff007f;
  text-shadow: 0 0 8px #ff007f, 0 0 15px #ff007f;
  font-size: 1.5rem;
  margin-bottom: 15px;
  border-bottom: 1px solid rgba(255, 0, 127, 0.3);
  padding-bottom: 5px;
}

/* 各セクションの共通カード */
.card {
  background: rgba(20, 30, 50, 0.7);
  border: 1px solid #00d4ff;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 30px;
  box-shadow: 0 0 15px rgba(0, 212, 255, 0.3), inset 0 0 10px rgba(0, 212, 255, 0.1);
  backdrop-filter: blur(5px);
}

/* ===== 世界時計 ===== */
.world-clock {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.clock-search {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.clock-search input[type="text"] {
  flex: 1;
  padding: 10px 15px;
  border: 2px solid #00d4ff;
  border-radius: 30px;
  background: rgba(0, 212, 255, 0.1);
  color: #fff;
  font-size: 1rem;
  outline: none;
  transition: all 0.3s;
}

.clock-search input[type="text"]:focus {
  box-shadow: 0 0 15px #00d4ff;
}

.clock-search select {
  padding: 10px;
  border: 2px solid #00d4ff;
  border-radius: 30px;
  background: #1B2735;
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
}

.clock-display {
  text-align: center;
  font-size: 3rem;
  font-weight: bold;
  color: #39ff14;
  text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14, 0 0 40px #39ff14;
  letter-spacing: 3px;
}

.clock-city {
  text-align: center;
  color: #00d4ff;
  font-size: 1.2rem;
  margin-top: 5px;
}

/* ===== ストップウォッチ ===== */
.stopwatch-display {
  font-size: 3rem;
  text-align: center;
  color: #ff007f;
  text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
  margin: 20px 0;
  letter-spacing: 3px;
}

.btn-group {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn {
  padding: 12px 30px;
  border: 2px solid #00d4ff;
  border-radius: 50px;
  background: transparent;
  color: #00d4ff;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  text-shadow: 0 0 5px #00d4ff;
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
}

.btn:hover {
  background: #00d4ff;
  color: #000;
  box-shadow: 0 0 30px #00d4ff;
}

.btn-green {
  border-color: #39ff14;
  color: #39ff14;
  box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
  text-shadow: 0 0 5px #39ff14;
}

.btn-green:hover {
  background: #39ff14;
  color: #000;
  box-shadow: 0 0 30px #39ff14;
}

.btn-pink {
  border-color: #ff007f;
  color: #ff007f;
  box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
  text-shadow: 0 0 5px #ff007f;
}

.btn-pink:hover {
  background: #ff007f;
  color: #000;
  box-shadow: 0 0 30px #ff007f;
}

/* ===== アラーム ===== */
.alarm-setup {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 20px;
}

.alarm-time-input {
  display: flex;
  align-items: center;
  gap: 5px;
}

.alarm-time-input input[type="number"] {
  width: 70px;
  padding: 8px;
  border: 2px solid #ff007f;
  border-radius: 10px;
  background: rgba(255, 0, 127, 0.1);
  color: #fff;
  font-size: 1.2rem;
  text-align: center;
  outline: none;
}

.alarm-time-input input[type="number"]:focus {
  box-shadow: 0 0 10px #ff007f;
}

.alarm-days {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.day-check {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 5px 10px;
  border: 1px solid #00d4ff;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.3s;
}

.day-check:hover {
  background: rgba(0, 212, 255, 0.1);
}

.day-check input[type="checkbox"] {
  accent-color: #00d4ff;
}

.alarm-status {
  margin-top: 10px;
  color: #39ff14;
  font-size: 1.1rem;
  text-align: center;
}

/* ===== ポモドーロ ===== */
.pomodoro-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  margin-bottom: 20px;
}

.pomodoro-card {
  background: rgba(10, 20, 30, 0.8);
  border: 2px solid #39ff14;
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
  position: relative;
}

.pomodoro-card h3 {
  color: #39ff14;
  text-shadow: 0 0 8px #39ff14;
  margin-bottom: 10px;
  font-size: 1.2rem;
}

.pomodoro-settings {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  align-items: center;
}

.pomodoro-settings label {
  color: #ccc;
  font-size: 0.9rem;
}

.pomodoro-settings input[type="number"] {
  width: 60px;
  padding: 5px;
  border: 1px solid #39ff14;
  border-radius: 5px;
  background: rgba(57, 255, 20, 0.1);
  color: #fff;
  text-align: center;
}

.pomodoro-settings select {
  padding: 5px;
  border: 1px solid #39ff14;
  border-radius: 5px;
  background: #1B2735;
  color: #fff;
}

.pomodoro-display {
  font-size: 2.5rem;
  text-align: center;
  color: #fff;
  text-shadow: 0 0 15px #39ff14;
  margin: 15px 0;
  font-weight: bold;
}

.pomodoro-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.pomodoro-status {
  text-align: center;
  margin-top: 10px;
  color: #ff007f;
  font-size: 0.9rem;
}

/* 追加ボタン */
.add-pomodoro-btn {
  display: block;
  margin: 20px auto;
  padding: 15px 40px;
  font-size: 1.2rem;
  border: 2px dashed #ff007f;
  background: transparent;
  color: #ff007f;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s;
  text-shadow: 0 0 5px #ff007f;
}

.add-pomodoro-btn:hover {
  background: rgba(255, 0, 127, 0.1);
  box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
}

/* ===== 通知許可ボタン ===== */
.notification-permission {
  text-align: center;
  margin: 20px 0;
}

.notification-permission button {
  padding: 10px 20px;
  border: 2px solid #ff007f;
  border-radius: 30px;
  background: transparent;
  color: #ff007f;
  cursor: pointer;
  transition: all 0.3s;
}

.notification-permission button:hover {
  background: #ff007f;
  color: #000;
}

/* レスポンシブ */
@media (max-width: 768px) {
  h1 { font-size: 1.8rem; }
  .clock-display { font-size: 2rem; }
  .stopwatch-display { font-size: 2rem; }
  .pomodoro-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <h1>⚡ NEON TIMER ⚡</h1>

  <!-- 通知許可ボタン -->
  <div class="notification-permission">
    <button id="requestPermissionBtn">🔔 デスクトップ通知を許可する</button>
  </div>

  <!-- ===== 世界時計 ===== -->
  <div class="card">
    <h2>🌍 世界時計</h2>
    <div class="world-clock">
      <div class="clock-search">
        <input type="text" id="citySearch" placeholder="都市名で検索...">
        <select id="citySelect" size="1"></select>
      </div>
      <div class="clock-display" id="worldClockTime">00:00:00</div>
      <div class="clock-city" id="worldClockCity">東京</div>
    </div>
  </div>

  <!-- ===== ストップウォッチ ===== -->
  <div class="card">
    <h2>⏱️ ストップウォッチ</h2>
    <div class="stopwatch-display" id="stopwatchDisplay">00:00.00</div>
    <div class="btn-group">
      <button class="btn btn-green" id="swStart">スタート</button>
      <button class="btn btn-pink" id="swStop">ストップ</button>
      <button class="btn" id="swReset">リセット</button>
    </div>
  </div>

  <!-- ===== アラーム ===== -->
  <div class="card">
    <h2>⏰ アラーム</h2>
    <div class="alarm-setup">
      <div class="alarm-time-input">
        <input type="number" id="alarmHour" min="0" max="23" value="7" placeholder="時">
        <span>:</span>
        <input type="number" id="alarmMin" min="0" max="59" value="0" placeholder="分">
      </div>
      <div class="alarm-days" id="alarmDays">
        <label class="day-check"><input type="checkbox" value="0">日</label>
        <label class="day-check"><input type="checkbox" value="1">月</label>
        <label class="day-check"><input type="checkbox" value="2">火</label>
        <label class="day-check"><input type="checkbox" value="3">水</label>
        <label class="day-check"><input type="checkbox" value="4">木</label>
        <label class="day-check"><input type="checkbox" value="5">金</label>
        <label class="day-check"><input type="checkbox" value="6">土</label>
      </div>
      <button class="btn btn-pink" id="alarmSetBtn">アラーム設定</button>
    </div>
    <div class="alarm-status" id="alarmStatus">アラーム未設定</div>
  </div>

  <!-- ===== ポモドーロタイマー ===== -->
  <div class="card">
    <h2>🍅 ポモドーロタイマー</h2>
    <div class="pomodoro-grid" id="pomodoroGrid">
      <!-- 初期2基はJSで生成 -->
    </div>
    <button class="add-pomodoro-btn" id="addPomodoroBtn">+ ポモドーロタイマーを追加</button>
  </div>
</div>

<script>
// ============================================================
// グローバル設定
// ============================================================
const MAX_LIMIT_SECONDS = 23 * 3600 + 59 * 60 + 59; // 23:59:59の秒数

// 共通：秒数を「HH:MM:SS」形式に変換
function formatHMS(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  if (seconds > MAX_LIMIT_SECONDS) seconds = MAX_LIMIT_SECONDS; // ガード
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// 共通：秒数を「MM:SS.ss」形式に変換（ストップウォッチ用）
function formatStopwatch(centiseconds) {
  const cs = Math.floor(centiseconds % 100);
  const totalSeconds = Math.floor(centiseconds / 100);
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

// デスクトップ通知を送信する関数
function sendNotification(title, body) {
  if (!('Notification' in window)) {
    console.log('このブラウザは通知をサポートしていません');
    return;
  }
  if (Notification.permission === 'granted') {
    new Notification(title, { body: body, icon: '🔔' });
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(permission => {
      if (permission === 'granted') {
        new Notification(title, { body: body, icon: '🔔' });
      }
    });
  }
}

// ============================================================
// 世界時計
// ============================================================
const cityData = [
  { city: '東京', timezone: 'Asia/Tokyo' },
  { city: 'ニューヨーク', timezone: 'America/New_York' },
  { city: 'ロンドン', timezone: 'Europe/London' },
  { city: 'パリ', timezone: 'Europe/Paris' },
  { city: 'シドニー', timezone: 'Australia/Sydney' },
  { city: '上海', timezone: 'Asia/Shanghai' },
  { city: '香港', timezone: 'Asia/Hong_Kong' },
  { city: 'ロサンゼルス', timezone: 'America/Los_Angeles' },
  { city: 'サンフランシスコ', timezone: 'America/Los_Angeles' },
  { city: 'シカゴ', timezone: 'America/Chicago' },
  { city: 'デンバー', timezone: 'America/Denver' },
  { city: 'マイアミ', timezone: 'America/New_York' },
  { city: 'メキシコシティ', timezone: 'America/Mexico_City' },
  { city: 'サンパウロ', timezone: 'America/Sao_Paulo' },
  { city: 'ブエノスアイレス', timezone: 'America/Argentina/Buenos_Aires' },
  { city: 'ダブリン', timezone: 'Europe/Dublin' },
  { city: 'ベルリン', timezone: 'Europe/Berlin' },
  { city: 'マドリード', timezone: 'Europe/Madrid' },
  { city: 'ローマ', timezone: 'Europe/Rome' },
  { city: 'モスクワ', timezone: 'Europe/Moscow' },
  { city: 'ドバイ', timezone: 'Asia/Dubai' },
  { city: 'ムンバイ', timezone: 'Asia/Kolkata' },
  { city: 'シンガポール', timezone: 'Asia/Singapore' },
  { city: 'ソウル', timezone: 'Asia/Seoul' },
  { city: '台北', timezone: 'Asia/Taipei' },
  { city: 'マニラ', timezone: 'Asia/Manila' },
  { city: 'バンコク', timezone: 'Asia/Bangkok' },
  { city: 'ジャカルタ', timezone: 'Asia/Jakarta' },
  { city: 'ホノルル', timezone: 'Pacific/Honolulu' },
  { city: 'オークランド', timezone: 'Pacific/Auckland' }
];

// ドロップダウンを構築
const citySelect = document.getElementById('citySelect');
const citySearch = document.getElementById('citySearch');
const worldClockTime = document.getElementById('worldClockTime');
const worldClockCity = document.getElementById('worldClockCity');

function populateCitySelect(filterText = '') {
  const filter = filterText.toLowerCase();
  citySelect.innerHTML = '';
  cityData.forEach(item => {
    if (item.city.toLowerCase().includes(filter)) {
      const option = document.createElement('option');
      option.value = item.timezone;
      option.textContent = item.city;
      citySelect.appendChild(option);
    }
  });
  // 選択が空になる場合は全表示
  if (citySelect.options.length === 0) {
    cityData.forEach(item => {
      const option = document.createElement('option');
      option.value = item.timezone;
      option.textContent = item.city;
      citySelect.appendChild(option);
    });
  }
}

// 初期表示
populateCitySelect();

// 検索フィルタ
citySearch.addEventListener('input', (e) => {
  populateCitySelect(e.target.value);
});

// 選択変更で都市名表示
citySelect.addEventListener('change', () => {
  const selectedOption = citySelect.options[citySelect.selectedIndex];
  if (selectedOption) {
    worldClockCity.textContent = selectedOption.textContent;
  }
});

// 世界時計を更新
function updateWorldClock() {
  const timezone = citySelect.value;
  if (timezone) {
    const now = new Date();
    const options = { timeZone: timezone, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
    const timeStr = now.toLocaleTimeString('ja-JP', options);
    worldClockTime.textContent = timeStr;
  }
}
setInterval(updateWorldClock, 1000);
updateWorldClock();

// ============================================================
// ストップウォッチ
// ============================================================
let swInterval = null;
let swRunning = false;
let swStartTime = 0;
let swElapsed = 0; // センチ秒単位

const swDisplay = document.getElementById('stopwatchDisplay');
const swStartBtn = document.getElementById('swStart');
const swStopBtn = document.getElementById('swStop');
const swResetBtn = document.getElementById('swReset');

swStartBtn.addEventListener('click', () => {
  if (!swRunning) {
    swRunning = true;
    swStartTime = Date.now() - swElapsed * 10; // センチ秒→ミリ秒
    swInterval = setInterval(() => {
      swElapsed = Math.floor((Date.now() - swStartTime) / 10);
      swDisplay.textContent = formatStopwatch(swElapsed);
    }, 10);
  }
});

swStopBtn.addEventListener('click', () => {
  if (swRunning) {
    swRunning = false;
    clearInterval(swInterval);
  }
});

swResetBtn.addEventListener('click', () => {
  swRunning = false;
  clearInterval(swInterval);
  swElapsed = 0;
  swDisplay.textContent = '00:00.00';
});

// ============================================================
// アラーム
// ============================================================
let alarmActive = false;
let alarmHour = 7;
let alarmMin = 0;
let alarmDays = []; // 曜日番号 0=日,1=月,...

const alarmStatus = document.getElementById('alarmStatus');
const alarmSetBtn = document.getElementById('alarmSetBtn');

// 曜日チェックボックスの初期状態（月〜金を選択）
document.querySelectorAll('#alarmDays input[type="checkbox"]').forEach(cb => {
  cb.checked = (cb.value >= '1' && cb.value <= '5');
});

alarmSetBtn.addEventListener('click', () => {
  alarmHour = parseInt(document.getElementById('alarmHour').value) || 0;
  alarmMin = parseInt(document.getElementById('alarmMin').value) || 0;
  if (alarmHour > 23) alarmHour = 23;
  if (alarmMin > 59) alarmMin = 59;
  
  alarmDays = [];
  document.querySelectorAll('#alarmDays input[type="checkbox"]:checked').forEach(cb => {
    alarmDays.push(parseInt(cb.value));
  });
  
  if (alarmDays.length === 0) {
    alarmStatus.textContent = '⚠️ 曜日を選択してください';
    alarmStatus.style.color = '#ff007f';
    return;
  }
  
  alarmActive = true;
  alarmStatus.textContent = `🔔 アラーム設定済み: ${String(alarmHour).padStart(2,'0')}:${String(alarmMin).padStart(2,'0')} (${alarmDays.map(d => ['日','月','火','水','木','金','土'][d]).join(',')})`;
  alarmStatus.style.color = '#39ff14';
});

// アラームチェックループ
function checkAlarm() {
  if (!alarmActive) return;
  const now = new Date();
  const currentHour = now.getHours();
  const currentMin = now.getMinutes();
  const currentDay = now.getDay(); // 0=日
  
  if (currentHour === alarmHour && currentMin === alarmMin && alarmDays.includes(currentDay)) {
    // 一致したら通知
    sendNotification('⏰ アラーム', `指定時刻になりました！ (${String(alarmHour).padStart(2,'0')}:${String(alarmMin).padStart(2,'0')})`);
    // 音を鳴らす（Web Audio API）
    playBeep();
    // アラームを停止（一度だけにするなら）
    alarmActive = false;
    alarmStatus.textContent = '⏰ アラームが鳴りました';
    alarmStatus.style.color = '#ff007f';
  }
}
setInterval(checkAlarm, 1000);

// ビープ音を鳴らす関数
function playBeep() {
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz
  gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
  oscillator.start(audioCtx.currentTime);
  oscillator.stop(audioCtx.currentTime + 0.5);
}

// ============================================================
// ポモドーロタイマー
// ============================================================
let pomodoroCount = 0;
const pomodoroGrid = document.getElementById('pomodoroGrid');
const addPomodoroBtn = document.getElementById('addPomodoroBtn');

// ポモドーロタイマー生成関数
function createPomodoroTimer() {
  pomodoroCount++;
  const card = document.createElement('div');
  card.className = 'pomodoro-card';
  card.dataset.id = pomodoroCount;
  
  // 設定値
  const workMinutes = 25; // デフォルト作業時間（分）
  const rounds = 4;       // デフォルトラウンド数
  const loopEnabled = false; // デフォルトはループOFF
  
  card.innerHTML = `
    <h3>ポモドーロ ${pomodoroCount}</h3>
    <div class="pomodoro-settings">
      <label>作業時間:
        <input type="number" class="pomo-work-min" min="1" max="60" value="${workMinutes}"> 分
      </label>
      <label>ラウンド数:
        <input type="number" class="pomo-rounds" min="1" max="10" value="${rounds}">
      </label>
      <label>ループ:
        <select class="pomo-loop">
          <option value="false" ${!loopEnabled ? 'selected' : ''}>OFF</option>
          <option value="true" ${loopEnabled ? 'selected' : ''}>ON</option>
        </select>
      </label>
    </div>
    <div class="pomodoro-display" data-phase="work">25:00</div>
    <div class="pomodoro-controls">
      <button class="btn btn-green pomo-start">スタート</button>
      <button class="btn btn-pink pomo-pause">一時停止</button>
      <button class="btn pomo-reset">リセット</button>
      <button class="btn pomo-delete">削除</button>
    </div>
    <div class="pomodoro-status">ラウンド 0 / ${rounds}</div>
  `;
  
  pomodoroGrid.appendChild(card);
  initializePomodoroCard(card);
}

// ポモドーロカードの初期化（イベント設定）
function initializePomodoroCard(card) {
  const display = card.querySelector('.pomodoro-display');
  const startBtn = card.querySelector('.pomo-start');
  const pauseBtn = card.querySelector('.pomo-pause');
  const resetBtn = card.querySelector('.pomo-reset');
  const deleteBtn = card.querySelector('.pomo-delete');
  const workMinInput = card.querySelector('.pomo-work-min');
  const roundsInput = card.querySelector('.pomo-rounds');
  const loopSelect = card.querySelector('.pomo-loop');
  const statusDiv = card.querySelector('.pomodoro-status');
  
  // 状態変数
  let timerInterval = null;
  let isRunning = false;
  let currentPhase = 'work'; // 'work' または 'break'
  let currentRound = 0;
  let totalRounds = parseInt(roundsInput.value) || 1;
  let workSeconds = (parseInt(workMinInput.value) || 25) * 60;
  let breakSeconds = 5 * 60; // デフォルト休憩5分
  let remainingSeconds = workSeconds;
  
  // 表示更新
  function updateDisplay() {
    display.textContent = formatHMS(remainingSeconds);
    statusDiv.textContent = `ラウンド ${currentRound} / ${totalRounds} (${currentPhase === 'work' ? '作業' : '休憩'})`;
  }
  
  // タイマー停止
  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    isRunning = false;
  }
  
  // リセット
  function resetTimer() {
    stopTimer();
    currentPhase = 'work';
    currentRound = 0;
    workSeconds = (parseInt(workMinInput.value) || 25) * 60;
    remainingSeconds = workSeconds;
    updateDisplay();
  }
  
  // 次のフェーズへ
  function nextPhase() {
    if (currentPhase === 'work') {
      // 作業終了 → 休憩へ
      currentRound++;
      if (currentRound >= totalRounds) {
        // 全ラウンド完了
        if (loopSelect.value === 'true') {
          // ループONなら最初から
          currentRound = 0;
          currentPhase = 'work';
          remainingSeconds = workSeconds;
          sendNotification('🍅 ポモドーロ', '全ラウンド完了！ループします');
        } else {
          // ループOFFなら停止
          sendNotification('🍅 ポモドーロ', '全ラウンド完了！お疲れ様でした');
          stopTimer();
          currentPhase = 'work';
          currentRound = 0;
          remainingSeconds = workSeconds;
          updateDisplay();
          return;
        }
      } else {
        currentPhase = 'break';
        remainingSeconds = breakSeconds;
        sendNotification('☕ 休憩', '作業完了！休憩しましょう');
      }
    } else {
      // 休憩終了 → 作業へ
      currentPhase = 'work';
      remainingSeconds = workSeconds;
      sendNotification('🍅 作業開始', '休憩終了！作業を再開しましょう');
    }
    updateDisplay();
  }
  
  // スタートボタン
  startBtn.addEventListener('click', () => {
    if (isRunning) return;
    isRunning = true;
    timerInterval = setInterval(() => {
      remainingSeconds--;
      if (remainingSeconds <= 0) {
        // フェーズ切り替え
        nextPhase();
      }
      updateDisplay();
    }, 1000);
  });
  
  // 一時停止
  pauseBtn.addEventListener('click', () => {
    stopTimer();
  });
  
  // リセット
  resetBtn.addEventListener('click', () => {
    resetTimer();
  });
  
  // 削除
  deleteBtn.addEventListener('click', () => {
    if (pomodoroGrid.children.length > 1) {
      stopTimer();
      card.remove();
    } else {
      alert('最低1つのポモドーロタイマーが必要です');
    }
  });
  
  // 設定変更時はリセット
  workMinInput.addEventListener('change', () => {
    workSeconds = (parseInt(workMinInput.value) || 25) * 60;
    if (!isRunning) {
      remainingSeconds = workSeconds;
      updateDisplay();
    }
  });
  
  roundsInput.addEventListener('change', () => {
    totalRounds = parseInt(roundsInput.value) || 1;
    if (totalRounds < 1) totalRounds = 1;
    roundsInput.value = totalRounds;
    if (!isRunning) {
      currentRound = 0;
      updateDisplay();
    }
  });
  
  loopSelect.addEventListener('change', () => {
    // ループ設定変更は即反映
  });
  
  // 初期表示
  updateDisplay();
}

// 初期2基を生成
createPomodoroTimer();
createPomodoroTimer();

// 追加ボタン
addPomodoroBtn.addEventListener('click', () => {
  createPomodoroTimer();
});

const requestPermissionBtn = document.getElementById('requestPermissionBtn');
requestPermissionBtn.addEventListener('click', () => {
  if ('Notification' in window) {
    Notification.requestPermission().then(permission => {
      if (permission === 'granted') {
        sendNotification('通知許可', 'デスクトップ通知が有効になりました！');
      }
    });
  } else {
    alert('このブラウザは通知をサポートしていません');
  }
});

// ============================================================
// 共通ガードロジック検証（デモ用）
// すべてのタイマーで入力値が23:59:59を超えたら自動補正
// 実際には各タイマーの入力処理でチェックしている
// ============================================================
function validateTimeInput(value) {
  // 秒数に変換して最大値チェック
  let seconds = typeof value === 'number' ? value : parseInt(value) || 0;
  if (seconds > MAX_LIMIT_SECONDS) {
    console.warn('最大値を超えたため23:59:59に補正しました');
    return MAX_LIMIT_SECONDS;
  }
  return seconds;
}

// 例：ポモドーロの作業時間入力を分で受け取るが、秒に変換してチェック
// この関数を各入力イベントで呼ぶことでガードを実現
// 実際のコードは各入力処理で行っている
